<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduNexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
/* Runs before the page draws, so there is no flash of the wrong theme. */
(function(){
  try{
    var p = JSON.parse(localStorage.getItem("edunexus-prefs") || "{}"), r = document.documentElement;
    var t = p.theme || "dark";
    if(t === "system") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    r.dataset.theme = t; r.dataset.accent = p.accent || "teal";
    r.dataset.size = p.size || "normal"; r.dataset.motion = p.motion || "full";
  }catch(e){}
})();
</script>
<style>
:root{
  /* Midnight — the original look */
  --bg:#040a09; --bg2:#070f0e; --panel:#0a1614; --panel2:#0d1d1a;
  --line:#153630; --line-soft:#102520; --bar:rgba(7,15,14,.96);
  --accent-rgb:47,227,192; --teal:#2fe3c0; --teal-dim:#1c8c78; --teal-ghost:rgba(var(--accent-rgb),.10);
  --on-accent:#032019;
  --ink:#e6f6f2; --ink-2:#a9c8c1; --mute:#6f918a;
  --warn:#f08a5d; --warn-soft:rgba(240,138,93,.12); --warn-line:rgba(240,138,93,.45);
  --r:14px; --r-sm:10px;
  --fs-1:11px; --fs-2:12.5px; --fs-3:14px; --fs-4:16px; --fs-5:20px; --fs-6:26px; --fs-7:34px;
  color-scheme:dark;
}
/* Light */
:root[data-theme="light"]{
  --bg:#f4f8f7; --bg2:#eaf2f0; --panel:#ffffff; --panel2:#f1f7f5;
  --line:#cfe1dc; --line-soft:#e1ece9; --bar:rgba(255,255,255,.96);
  --accent-rgb:14,150,125; --teal:#0e967d; --teal-dim:#7fcdbd;
  --on-accent:#ffffff;
  --ink:#0c201c; --ink-2:#36524c; --mute:#688680;
  --warn:#cc5a26; --warn-soft:rgba(204,90,38,.09); --warn-line:rgba(204,90,38,.4);
  color-scheme:light;
}
/* Accents. The orange warning colour never changes: it only ever means "weak". */
:root[data-accent="sky"]    {--accent-rgb:92,190,255;  --teal:#5cbeff; --teal-dim:#2a6f9c; --on-accent:#021726;}
:root[data-accent="violet"] {--accent-rgb:176,140,255; --teal:#b08cff; --teal-dim:#6848b0; --on-accent:#160a33;}
:root[data-accent="lime"]   {--accent-rgb:176,230,90;  --teal:#b0e65a; --teal-dim:#5f8a24; --on-accent:#162205;}
:root[data-theme="light"][data-accent="sky"]    {--accent-rgb:14,116,184;  --teal:#0e74b8; --teal-dim:#8cc3e6; --on-accent:#fff;}
:root[data-theme="light"][data-accent="violet"] {--accent-rgb:112,72,210;  --teal:#7048d2; --teal-dim:#c3b0f0; --on-accent:#fff;}
:root[data-theme="light"][data-accent="lime"]   {--accent-rgb:74,124,20;   --teal:#4a7c14; --teal-dim:#b6d88a; --on-accent:#fff;}
/* Text size */
:root[data-size="compact"]{--fs-1:10px;--fs-2:11.5px;--fs-3:13px;--fs-4:15px;--fs-5:18px;--fs-6:23px;--fs-7:30px;}
:root[data-size="large"]  {--fs-1:12.5px;--fs-2:14px;--fs-3:16px;--fs-4:18px;--fs-5:22px;--fs-6:29px;--fs-7:38px;}
:root[data-motion="reduced"] *{animation:none!important;transition:none!important;}
/* The wordmark is teal on transparent; darken it enough to read on white. */
.wordmark{display:block;height:30px;width:auto;max-width:100%}
:root[data-theme="light"] .wordmark{filter:brightness(.62) saturate(1.3)}

/* ---- player banner ---- */
.pbanner{position:relative;border-radius:18px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;
  gap:16px;flex-wrap:wrap;color:#fff;border:1px solid rgba(255,255,255,.12);overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 30px rgba(0,0,0,.25);background-size:auto;}
.pbanner::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.35),transparent 55%);pointer-events:none}
.pbanner > *{position:relative;z-index:1}
.pb-left{display:flex;align-items:center;gap:14px;min-width:0}
.pb-ring{padding:3px;border-radius:50%;background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(255,255,255,.25));flex:none}
.pb-ring .avatar{border:2px solid rgba(0,0,0,.35);background:#0d1d1a;color:#fff}
.pb-name{font-size:var(--fs-5);font-weight:800;letter-spacing:-.02em;text-shadow:0 2px 8px rgba(0,0,0,.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb-sub{font-size:var(--fs-2);color:rgba(255,255,255,.78)}
.pb-stat{display:inline-block;margin-top:6px;font-size:var(--fs-1);font-weight:700;padding:3px 9px;border-radius:99px;background:rgba(0,0,0,.35);color:#fff}
.pb-badges{display:flex;gap:10px}
.pb-slot{width:78px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:12px;background:rgba(0,0,0,.28);
  border:1px solid rgba(255,255,255,.14)}
.pb-slot span{font-size:10px;font-weight:700;text-align:center;line-height:1.2;color:#fff}
.pb-slot.empty{border-style:dashed;justify-content:center;min-height:78px}
.pb-slot.empty span{color:rgba(255,255,255,.5)}
.pbanner.small{padding:12px 14px;border-radius:14px}
.pbanner.small .pb-name{font-size:var(--fs-4)}
.pbanner.small .pb-slot{width:54px;padding:5px 3px}
.pbanner.small .pb-slot span{display:none}
.pbanner.small .pb-slot.empty{min-height:48px}
@media (max-width:600px){ .pb-badges{width:100%;justify-content:space-between} .pb-slot{flex:1;width:auto} }
/* ---- customiser ---- */
.bn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.bn-tile{position:relative;height:84px;border-radius:14px;border:2px solid transparent;text-align:left;padding:10px;color:#fff;overflow:hidden}
.bn-tile.on{border-color:var(--teal)}
.bn-tile.locked{filter:saturate(.35) brightness(.7)}
.bn-name{font-weight:800;font-size:var(--fs-3);text-shadow:0 2px 6px rgba(0,0,0,.5)}
.bn-lock{position:absolute;left:10px;bottom:9px;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:rgba(0,0,0,.55);color:#fff}
.bd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.bd-card{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:14px 10px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--bg2)}
.bd-card.on{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal) inset;background:var(--teal-ghost)}
.bd-card.locked{cursor:default}
.bd-name{font-weight:700;font-size:var(--fs-2)}
.bd-tier{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}

.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{display:flex;align-items:center;gap:9px;padding:9px 13px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--bg2);font-size:var(--fs-2);font-weight:600;color:var(--ink-2)}
.swatch.on{border-color:var(--teal);color:var(--ink);box-shadow:0 0 0 1px var(--teal) inset}
.swatch i{width:16px;height:16px;border-radius:50%;display:inline-block;flex:none}
.preview{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--bg)}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:var(--fs-3);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(900px 500px at 12% -10%,rgba(var(--accent-rgb),.07),transparent 60%),
    radial-gradient(700px 400px at 100% 100%,rgba(var(--accent-rgb),.05),transparent 60%);
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
a{color:inherit;text-decoration:none;}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

/* ---------- shell ---------- */
.app{position:relative;z-index:1;display:grid;grid-template-columns:232px minmax(0,1fr) 312px;min-height:100vh;}
.side{border-right:1px solid var(--line-soft);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px;}
.brand b{font-size:var(--fs-4);font-weight:800;letter-spacing:-.02em;}
.nav{display:flex;flex-direction:column;gap:2px;}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--r-sm);color:var(--ink-2);font-weight:600;font-size:var(--fs-3);}
.nav a:hover{background:var(--panel);color:var(--ink);}
.nav a.on{background:var(--teal-ghost);color:var(--teal);}
.nav-sep{height:1px;background:var(--line);margin:10px 12px;}
.nav-label{margin:18px 12px 6px;font-size:var(--fs-1);color:var(--mute);font-weight:600;}
.side-foot{margin-top:auto;border-top:1px solid var(--line-soft);padding-top:12px;}

.main{min-width:0;padding:26px 30px 90px;}
.aside{border-left:1px solid var(--line-soft);padding:22px 18px;position:sticky;top:0;height:100vh;overflow:auto;}

.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:22px;}
.h1{font-size:var(--fs-7);font-weight:800;letter-spacing:-.03em;margin:0;line-height:1.1;}
.h2{font-size:var(--fs-5);font-weight:700;letter-spacing:-.02em;margin:0 0 12px;}
.sub{color:var(--mute);font-size:var(--fs-2);margin-top:5px;}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);
  display:grid;place-items:center;font-weight:700;color:var(--teal);font-size:var(--fs-2);flex:none;}

/* ---------- pieces ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;}
.card.flat{background:var(--bg2);}
.grid{display:grid;gap:14px;}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g4{grid-template-columns:repeat(4,minmax(0,1fr));}
.row{display:flex;align-items:center;gap:10px;}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;}
.stat .k{font-size:var(--fs-2);color:var(--mute);}
.stat .v{font-size:var(--fs-6);font-weight:700;letter-spacing:-.02em;margin-top:2px;}
.stat.warn{border-color:var(--warn-line);background:var(--warn-soft);}
.stat.warn .v{color:var(--warn);}

.bar{height:6px;border-radius:99px;background:var(--line-soft);overflow:hidden;}
.bar i{display:block;height:100%;background:var(--teal);border-radius:99px;}
.bar.warn i{background:var(--warn);}
.pct{font-variant-numeric:tabular-nums;font-weight:700;}
.pct.warn{color:var(--warn);}

.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:99px;
  border:1px solid var(--line);background:var(--bg2);font-size:var(--fs-1);color:var(--ink-2);}
.chip.teal{border-color:rgba(var(--accent-rgb),.4);color:var(--teal);background:var(--teal-ghost);}
.chip.warn{border-color:var(--warn-line);color:var(--warn);background:var(--warn-soft);}

.tag{display:inline-flex;padding:2px 7px;border-radius:5px;font-size:var(--fs-1);font-weight:700;letter-spacing:.02em;}
.tag.gap{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-line);}
.tag.slip{background:var(--panel2);color:var(--ink-2);border:1px solid var(--line);}
.tag.pace{background:var(--panel2);color:var(--ink-2);border:1px solid var(--line);}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 15px;border-radius:var(--r-sm);
  background:var(--teal);color:var(--on-accent);font-weight:700;font-size:var(--fs-2);}
.btn:hover{filter:brightness(1.07);}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
.btn.ghost:hover{background:var(--panel2);}
.btn.sm{padding:7px 12px;font-size:var(--fs-1);}
.btn[disabled]{opacity:.55;cursor:default;filter:none;}

.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;}
.tabs button{padding:7px 13px;border-radius:99px;border:1px solid var(--line);color:var(--ink-2);font-size:var(--fs-2);font-weight:600;}
.tabs button.on{background:var(--teal);border-color:var(--teal);color:var(--on-accent);}

.list{display:flex;flex-direction:column;}
.list .item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 12px;border-radius:var(--r-sm);}
.list .item + .item{border-top:1px solid var(--line-soft);}
.item.on{background:var(--teal-ghost);}
.item.locked{color:var(--mute);}
.done{color:var(--teal);}

.ai{border:1px solid rgba(var(--accent-rgb),.32);background:linear-gradient(180deg,rgba(var(--accent-rgb),.08),rgba(var(--accent-rgb),.02));
  border-radius:var(--r);padding:14px;}
.ai .who{display:flex;align-items:center;gap:7px;color:var(--teal);font-weight:700;font-size:var(--fs-2);margin-bottom:7px;}
.ai p{margin:0 0 10px;font-size:var(--fs-2);color:var(--ink);line-height:1.55;}

.note{font-size:var(--fs-1);color:var(--mute);}
.sec{margin:26px 0 12px;font-size:var(--fs-2);color:var(--mute);font-weight:600;}
.sec:first-child{margin-top:0;}
.divider{height:1px;background:var(--line-soft);margin:14px 0;}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;font-size:var(--fs-2);}
.kv + .kv{border-top:1px solid var(--line-soft);}
.kv span:first-child{color:var(--mute);}
.crumb{font-size:var(--fs-2);color:var(--mute);margin-bottom:10px;}
.crumb a:hover{color:var(--teal);}
.warn-text{color:var(--warn);}
.teal-text{color:var(--teal);}
.mono{font-variant-numeric:tabular-nums;}

/* counsellor */
.chat{display:flex;flex-direction:column;gap:14px;}
.msg{max-width:76%;padding:12px 14px;border-radius:var(--r);font-size:var(--fs-2);line-height:1.6;}
.msg.me{align-self:flex-end;background:var(--teal);color:var(--on-accent);font-weight:600;border-bottom-right-radius:4px;}
.msg.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px;}
.msg.ai .evidence{margin:10px 0;border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;background:var(--bg2);}
.sources{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.composer{display:flex;gap:9px;margin-top:16px;}
.composer input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:12px 16px;color:var(--ink);font:inherit;font-size:var(--fs-2);}
.composer input::placeholder{color:var(--mute);}
.suggests{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;}
.suggests button{padding:7px 12px;border:1px solid var(--line);border-radius:99px;font-size:var(--fs-1);color:var(--ink-2);}
.suggests button:hover{border-color:var(--teal);color:var(--teal);}
.typing i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--teal);margin-right:3px;animation:blink 1.2s infinite;}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}

/* examlens question map */
.qmap{display:flex;gap:7px;flex-wrap:wrap;}
.q{width:52px;padding:6px 4px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--bg2);text-align:center;}
.q b{display:block;font-size:var(--fs-3);}
.q small{font-size:10px;color:var(--mute);}
.q.partial{border-color:rgba(240,138,93,.3);}
.q.loss{border-color:var(--warn-line);background:var(--warn-soft);color:var(--warn);}
.q.loss small{color:var(--warn);}
.q.on{outline:2px solid var(--teal);}
.legend{display:flex;gap:14px;font-size:var(--fs-1);color:var(--mute);margin-top:10px;flex-wrap:wrap;}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;}

/* answer compare */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.cmp .box{border-radius:var(--r-sm);padding:10px;font-size:var(--fs-2);}
.cmp .yours{background:var(--warn-soft);border:1px solid var(--warn-line);}
.cmp .right{background:var(--teal-ghost);border:1px solid rgba(var(--accent-rgb),.3);}
.cmp .lbl{font-size:var(--fs-1);color:var(--mute);margin-bottom:4px;}

/* mobile */
.mobilebar{display:none;}
@media (max-width:1180px){
  .app{grid-template-columns:200px minmax(0,1fr);}
  .aside{display:none;}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr;}
  .side{display:none;}
  .main{padding:18px 16px 96px;}
  .h1{font-size:var(--fs-6);}
  .g2,.g3,.g4{grid-template-columns:1fr;}
  .cmp{grid-template-columns:1fr;}
  .msg{max-width:92%;}
  .mobilebar{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:20;
    background:var(--bar);border-top:1px solid var(--line);
    padding:9px 6px calc(9px + env(safe-area-inset-bottom));
  }
  .mobilebar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--mute);font-weight:600;}
  .mobilebar a.on{color:var(--teal);}
  .mobiletop{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
}
@media (min-width:861px){.mobiletop{display:none;}}
.scroll-x{overflow-x:auto;}
svg{max-width:100%;height:auto;}
.fade{animation:fade .18s ease-out;}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
</style><style>
textarea,input[type=text],input[type=number],select{width:100%;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;color:var(--ink);font:inherit;font-size:var(--fs-2)}
textarea{min-height:110px;resize:vertical;line-height:1.6}
label.f{display:block;font-size:var(--fs-1);color:var(--mute);margin:12px 0 5px;font-weight:600}
.empty{text-align:center;padding:26px 18px}
.empty b{display:block;font-size:var(--fs-4);margin-bottom:6px}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--teal);
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}
.prose{font-size:var(--fs-3);line-height:1.65;white-space:pre-wrap}
</style>
</head>
<body>
<div id="gate" style="position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:var(--bg);color:var(--mute);font-size:13px">
  <span><span class="spin"></span>Loading your record…</span>
</div>
<div class="app" id="shell" style="visibility:hidden">
  <nav class="side">
    <a class="brand" href="#/" aria-label="EduNexus home">
      <img class="wordmark" src="branding/EduNexus-wordmark-transparent.png" alt="EduNexus">
    </a>
    <div class="nav" id="nav"></div>
    <div class="side-foot">
      <div class="note" id="whoami">—</div>
      <button class="btn ghost sm" id="signout" style="width:100%;margin-top:9px">Sign out</button>
    </div>
  </nav>
  <main class="main" id="main"></main>
  <aside class="aside" id="aside"></aside>
</div>
<nav class="mobilebar" id="mobilebar"></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
/* ==================================================================
   EduNexus — real data app.
   Every screen reads rows this account owns. Nothing is invented.
================================================================== */
const CFG = window.EDUNEXUS_CONFIG || {};
let sb = null, configProblem = null;
(function connect(){
  const url = (CFG.SUPABASE_URL||"").trim().replace(/\/+$/,""), key = (CFG.SUPABASE_ANON_KEY||"").trim();
  if(!url || !key || url.includes("PASTE_YOUR") || key.includes("PASTE_YOUR")){ configProblem="Add your Supabase URL and key to config.js."; return; }

/* ---------- the genome, computed from real evidence ---------- */
const WEIGHTS = { test:30, paper:22, examlens:18, mirage:18, quiz:14, doctor:10, lesson:6 };
const HALF_LIFE_DAYS = 60;
function genomeFrom(attempts){
  const now=Date.now(), map={};
  attempts.forEach(a=>{
    const w = WEIGHTS[a.kind] ?? 10;
    const decay = Math.pow(0.5, ((now-new Date(a.created_at))/86400000)/HALF_LIFE_DAYS);
    const t = map[a.topic] ||= {topic:a.topic, subject:a.subject||"", num:0, den:0, n:0, last:a.created_at};
    t.num += Number(a.score)*w*decay; t.den += w*decay; t.n++;
    if(new Date(a.created_at) > new Date(t.last)) t.last = a.created_at;
  });
  const topics = Object.values(map).map(t=>({
    topic:t.topic, subject:t.subject, evidence:t.n, last:t.last,
    score: Math.round(t.num/t.den),
    confidence: Math.min(100, Math.round(t.den/60*100))
  })).sort((a,b)=>a.score-b.score);
  const overall = topics.length ? Math.round(topics.reduce((s,t)=>s+t.score,0)/topics.length) : null;
  return { topics, overall, weakest: topics[0]||null, strongest: topics[topics.length-1]||null };
}
const G = () => genomeFrom(S.attempts);

/* One weighted score for any bundle of attempts. */
function scoreOf(atts){
  const now = Date.now(); let num=0, den=0, last=0;
  atts.forEach(a=>{
    const w = WEIGHTS[a.kind] ?? 10;
    const decay = Math.pow(0.5, ((now-new Date(a.created_at))/86400000)/HALF_LIFE_DAYS);
    num += Number(a.score)*w*decay; den += w*decay;
    last = Math.max(last, new Date(a.created_at).getTime());
  });
  return { score: den ? Math.round(num/den) : null, evidence: atts.length,
           confidence: Math.min(100, Math.round(den/60*100)), last };
}
/* Group attempts into the nodes one ring of the genome shows. */
function nodesBy(atts, keyFn){
  const map = {};
  atts.forEach(a=>{ const k = keyFn(a) || "Unsorted"; (map[k] ||= []).push(a); });
  return Object.entries(map).map(([name, rows])=>({ name, ...scoreOf(rows) }))
    .sort((a,b)=>a.score-b.score);
}

async function ai(task, payload){

  let res;
  try{

      body: JSON.stringify({ task, payload })
    });
  }catch(e){

  }
  if(res.status===404) throw new Error("No AI function found on this project. Run: supabase functions deploy ai");
  let out;
  try{ out = await res.json(); }
  catch(e){ throw new Error(`AI service returned ${res.status} with no JSON. Check Edge Functions → Logs.`); }

    throw new Error(out.error);
  }
  return out;
}

/* Shrink a photo before it goes over the wire — phone camera photos are often
   4-8MB, and Groq's vision model only reads up to 20MB and pays per-image in
   fixed tokens regardless of resolution, so there's nothing gained by full size. */
function fileToCompressedDataURL(file, maxDim = 1600, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width: w, height: h } = img;
        if (w > maxDim || h > maxDim) {
          const scale = maxDim / Math.max(w, h);
          w = Math.round(w * scale); h = Math.round(h * scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = () => reject(new Error("Could not read that photo"));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error("Could not read that photo"));
    reader.readAsDataURL(file);
  });
}

/* Radar web. Nodes are clickable when there's a level below them. */
function web(items, drillTo){
  const n = items.length;
  if(n < 3) return `<div class="card flat"><div class="note">A web needs at least three points to be worth drawing.
    ${n===0?"Nothing here yet.":"There "+(n===1?"is one":"are two")+" here, shown below instead."}</div></div>`;
  const cx=170, cy=160, R=105;
  const pt=(i,r)=>[cx+r*Math.cos(-Math.PI/2+i*2*Math.PI/n), cy+r*Math.sin(-Math.PI/2+i*2*Math.PI/n)];
  const rings=[25,50,75,100].map(p=>`<polygon points="${items.map((_,i)=>pt(i,R*p/100).join(",")).join(" ")}"
      fill="none" stroke="var(--line)"/>`).join("");
  const spokes=items.map((_,i)=>{const [x,y]=pt(i,R);
    return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`}).join("");
  const shape=items.map((t,i)=>pt(i,R*(t.score||0)/100).join(",")).join(" ");
  const parts=items.map((t,i)=>{
    const [dx,dy]=pt(i,R*(t.score||0)/100);
    const [lx,ly]=pt(i,R+28);
    const weak = t.score!==null && t.score<60;
    const label = t.name.length>22 ? t.name.slice(0,20)+"…" : t.name;
    const click = drillTo ? `data-act="drill" data-to="${drillTo(t)}" style="cursor:pointer"` : "";
    return `<g ${click}>
      <circle cx="${dx}" cy="${dy}" r="4" fill="${weak?"var(--warn)":"var(--teal)"}"/>
      <circle cx="${lx}" cy="${ly-4}" r="26" fill="transparent"/>
      <text x="${lx}" y="${ly}" font-size="10" text-anchor="middle" fill="${weak?"var(--warn)":"var(--ink-2)"}">${esc(label)}</text>
      <text x="${lx}" y="${ly+12}" font-size="10" font-weight="700" text-anchor="middle"
        fill="${weak?"var(--warn)":"var(--teal)"}">${t.score===null?"—":t.score+"%"}</text></g>`;
  }).join("");
  return `<svg viewBox="0 0 340 330" role="img" aria-label="Genome web">
    ${rings}${spokes}
    <polygon points="${shape}" fill="rgba(var(--accent-rgb),.15)" stroke="var(--teal)" stroke-width="1.6"/>
    ${parts}
    <text x="${cx}" y="322" font-size="9" text-anchor="middle" fill="var(--mute)">Rings mark 25, 50, 75 and 100 percent</text>
  </svg>`;
}

    title = "Learning genome";
    caption = "Each strand is a subject. Click one to open its topics.";
    crumb = "";
    drillTo = t => `#/genome/${enc(t.name)}`;
  } else if(!top){
    level = "topic"; atts = all.filter(a=>(a.subject||"Unsorted")===sub);
    items = nodesBy(atts, a=>a.topic);
    title = sub;
    caption = "Each strand is a topic in this subject. Click one to open its lessons.";
    crumb = `<div class="crumb"><a href="#/genome">Genome</a> · ${esc(sub)}</div>`;
    drillTo = t => `#/genome/${enc(sub)}/${enc(t.name)}`;
  } else {
    level = "lesson"; atts = all.filter(a=>(a.subject||"Unsorted")===sub && a.topic===top);
    items = nodesBy(atts, a=> a.lesson_id ? (lessonName(a.lesson_id) || "Lesson") : ({
      examlens:"ExamLens analysis", mirage:"Mirage run", paper:"Past paper", test:"Test", quiz:"Quiz"
    }[a.kind] || a.kind));
    title = top;
    caption = "Each strand is one lesson or assessment inside this topic. This is the bottom of the genome.";
    crumb = `<div class="crumb"><a href="#/genome">Genome</a> · <a href="#/genome/${enc(sub)}">${esc(sub)}</a> · ${esc(top)}</div>`;
    drillTo = null;
  }

  const here = scoreOf(atts);
  const weakest = items.filter(i=>i.score!==null)[0];

  return `
  ${crumb}
  <div class="topbar">
    <div><h1 class="h1" style="font-size:${level==="subject"?"var(--fs-7)":"var(--fs-6)"}">${esc(title)}</h1>
      <div class="sub">${caption}</div></div>
    <div class="row" style="gap:8px">
      ${sub?`<a class="btn ghost sm" href="${top?`#/genome/${enc(sub)}`:"#/genome"}">Back</a>`:""}
      <a class="btn ghost sm" href="#/weights">How is this scored?</a></div>
  </div>

  <div class="grid g3">
    <div class="stat"><div class="k">${level==="subject"?"Across everything":level==="topic"?"Subject score":"Topic score"}</div>
      <div class="v">${here.score===null?"—":here.score+"%"}</div>
      <div class="note">${here.evidence} attempt${here.evidence===1?"":"s"}</div></div>
    <div class="stat ${weakest && weakest.score<60?"warn":""}"><div class="k">Weakest strand</div>
      <div class="v" style="font-size:var(--fs-4)">${weakest?esc(weakest.name):"—"}</div>
      <div class="note">${weakest?weakest.score+"%":"nothing yet"}</div></div>
    <div class="stat"><div class="k">Confidence</div><div class="v">${here.confidence}%</div>
      <div class="note">how much evidence is behind this</div></div>
  </div>

  <div class="card" style="margin-top:14px;display:grid;place-items:center">
    ${web(items, drillTo)}
  </div>

  <div class="sec">${level==="subject"?"Subjects":level==="topic"?"Topics":"Lessons and assessments"}</div>
  <div class="card">
    ${items.map(t=>{
      const row = barRow(t.name, t.score, t.score!==null && t.score<60,
        `${t.evidence} attempt${t.evidence===1?"":"s"} · last ${ago(new Date(t.last))}`);
      return drillTo
        ? `<div data-act="drill" data-to="${drillTo(t)}" style="cursor:pointer">${row}</div>`
        : row;
    }).join("")}
  </div>
  ${drillTo?`<div class="note" style="margin-top:10px">Click any strand to go a level deeper.</div>`:
    `<div class="note" style="margin-top:10px">Nothing sits below a lesson. If a strand here is weak, that's the thing to redo.</div>`}

  ${weakest && weakest.score<60 ? `<div class="ai" style="margin-top:14px">
    <div class="who">${I.ai} Edu AI</div>
    <p>${esc(weakest.name)} is the weakest strand here at ${weakest.score}%. Ask me what to do about it and I'll answer from the questions you actually got wrong.</p>

};

function renderChat(){
  const c = $("#chat"); if(!c) return;
  if(!S.chat.length){
    c.innerHTML = `<div class="card empty"><b>Ask me anything about your work</b>
      <p class="note">I read your genome, your attempts and your goal. If there's no evidence for something, I'll tell you that instead of guessing.</p></div>`;
    return;
  }
  c.innerHTML = S.chat.map(m=>{
    if(m.role==="user") return `<div class="msg me">${esc(m.content)}</div>`;
    if(m.role==="typing") return `<div class="msg ai typing"><i></i><i></i><i></i></div>`;
    return `<div class="msg ai fade"><div class="prose" style="font-size:var(--fs-2)">${esc(m.content)}</div>
      ${m.topics&&m.topics.length?`<div class="sources">${m.topics.map(t=>`<span class="chip teal">${esc(t.topic)} ${t.score}%</span>`).join("")}</div>`:""}
      </div>`;
  }).join("");
  c.lastElementChild && c.lastElementChild.scrollIntoView({block:"end"});
}
async function send(text){
  if(!text || !text.trim()) return;
  S.chat.push({role:"user", content:text}); S.chat.push({role:"typing"}); renderChat();
  try{
    const history = S.chat.filter(m=>m.role==="user"||m.role==="assistant").slice(-6)
      .map(m=>({role:m.role, content:m.content}));
    const out = await ai("chat",{ message:text, history: history.slice(0,-1) });
    S.chat.pop(); S.chat.push({role:"assistant", content:out.reply, topics:out.topics});
  }catch(e){
    S.chat.pop(); S.chat.push({role:"assistant", content:"I couldn't reach the AI service. "+e.message});
  }
  renderChat();
}

/* ---- the facts badges are judged on ---- */
function streakOf(days){
  const set = new Set(days); let best = 0, run = 0;
  const sorted = [...set].sort();
  let prev = null;
  sorted.forEach(d=>{
    const t = new Date(d+"T00:00:00").getTime();
    run = (prev!==null && t - prev === 86400000) ? run+1 : 1;
    best = Math.max(best, run); prev = t;
  });
  return { best, days: set.size };
}
/* Every badge, earned or not, with progress towards it. */
function badgesFor(ctx){
  const { attempts=[], loginDays=[], portfolioCount=0, enrolledCount=0 } = ctx;
  const st = streakOf(loginDays);
  const lessonsPassed = attempts.filter(a=>a.kind==="lesson" && Number(a.score)>=100).length;
  const lens = attempts.filter(a=>a.kind==="examlens").length;
  const realDeal = attempts.some(a=>a.kind==="mirage" && a.meta && Number(a.meta.genuine)>=80
                                  && (Number(a.meta.apparent)-Number(a.meta.genuine))<=10);
  const comeback = (()=>{
    const byTopic = {};
    [...attempts].sort((x,y)=>new Date(x.created_at)-new Date(y.created_at)).forEach(a=>{
      (byTopic[a.topic] ||= []).push(Number(a.score));
    });
    return Object.values(byTopic).some(sc=>sc.some((v,i)=>sc.slice(i+1).some(w=>w>=v+30)));
  })();
  const n = (have, need) => ({ earned: have>=need, progress: Math.min(1, have/need), progressText: `${Math.min(have,need)} / ${need}` });
  const list = [
    { id:"login1",   name:"First Day",           tier:"common",    icon:"sun",   desc:"Sign in for the first time",           ...n(st.days,1) },
    { id:"enrolled", name:"Enrolled",            tier:"common",    icon:"book",  desc:"Join a course",                        ...n(enrolledCount,1) },
    { id:"first",    name:"First Steps",         tier:"common",    icon:"step",  desc:"Complete your first graded piece of work", ...n(attempts.length,1) },
    { id:"builder",  name:"Portfolio Builder",   tier:"common",    icon:"folder",desc:"Add 3 items to your portfolio",        ...n(portfolioCount,3) },
    { id:"login7",   name:"Regular",             tier:"rare",      icon:"cal",   desc:"Sign in on 7 different days",          ...n(st.days,7) },
    { id:"streak5",  name:"On a Roll",           tier:"rare",      icon:"flame", desc:"Sign in 5 days in a row",              ...n(st.best,5) },
    { id:"cp10",     name:"Checkpoint Champion", tier:"rare",      icon:"check", desc:"Pass 10 lesson checkpoints",           ...n(lessonsPassed,10) },
    { id:"lens5",    name:"Lens Wielder",        tier:"rare",      icon:"lens",  desc:"Analyse 5 answers with ExamLens",      ...n(lens,5) },
    { id:"login30",  name:"Devoted",             tier:"epic",      icon:"crown", desc:"Sign in on 30 different days",         ...n(st.days,30) },
    { id:"comeback", name:"Comeback",            tier:"epic",      icon:"up",    desc:"Beat an earlier score on a topic by 30 points",
      earned:comeback, progress:comeback?1:0, progressText:comeback?"Done":"Not yet" },
    { id:"realdeal", name:"The Real Deal",       tier:"legendary", icon:"gem",   desc:"Mirage: 80%+ genuine mastery with almost no gap",
      earned:realDeal, progress:realDeal?1:0, progressText:realDeal?"Done":"Not yet" }
  ];
  /* Strong Genome: one badge per subject scored 80% or more, on at least 3 attempts. */
  const subjects = {};
  attempts.forEach(a=>{ (subjects[a.subject||"Unsorted"] ||= []).push(a); });
  let best = null;
  Object.entries(subjects).forEach(([sub, rows])=>{
    const sc = scoreOf(rows).score;
    const ok = sc>=80 && rows.length>=3;
    if(ok) list.push({ id:"strong:"+sub, name:"Strong Genome", sub, tier:"legendary", icon:"brain",
      desc:`${sub} genome at 80% or above`, earned:true, progress:1, progressText:`${sc}%` });
    else if(!best || sc>best.sc) best = { sub, sc, n:rows.length };
  });
  if(!list.some(b=>b.id.startsWith("strong:")))
    list.push({ id:"strong:?", name:"Strong Genome", tier:"legendary", icon:"brain",
      desc:"Reach 80% or more on a subject, over at least 3 attempts", earned:false,
      progress: best ? Math.min(1,(best.sc||0)/80) : 0,
      progressText: best ? `Best: ${best.sub} ${best.sc}%` : "No subjects yet" });
  return list;
}

/* square-crop a photo before upload */
function squareImage(file, size=320){
  return new Promise((resolve,reject)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{
      const s = Math.min(img.width, img.height), c = document.createElement("canvas");
      c.width = c.height = size;
      c.getContext("2d").drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url);
      c.toBlob(b=> b ? resolve(b) : reject(new Error("Couldn't process that image")), "image/jpeg", 0.88);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error("Couldn't open that image")); };
    img.src = url;
  });
}
async function saveProfile(patch){
  const { error } = await sb.from("profiles").update(patch).eq("id", S.me.id);

}
document.addEventListener("change", async e=>{
  if(e.target.id !== "avFile" || !e.target.files[0]) return;
  S.busy.avatar = true; rerender();
  try{
    const blob = await squareImage(e.target.files[0]);
    const path = `${S.me.id}/avatar-${Date.now()}.jpg`;
    const { error } = await sb.storage.from("avatars").upload(path, blob, { contentType:"image/jpeg", upsert:true });
    if(error) throw error;
    const { data } = sb.storage.from("avatars").getPublicUrl(path);
    const old = S.me.avatar_url;
    if(await saveProfile({ avatar_url: data.publicUrl })){
      toast("Photo updated");
      const oldPath = old && old.split("/avatars/")[1];
      if(oldPath) sb.storage.from("avatars").remove([oldPath]);
    }
  }catch(err){
    toast(/bucket|not found/i.test(err.message) ? "Photo storage isn't set up yet — run profile-customization.sql" : err.message);
  }
  S.busy.avatar = false; rerender();
});

function applyPrefs(p){
  const r = document.documentElement;
  let t = p.theme;
  if(t === "system") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  r.dataset.theme = t; r.dataset.accent = p.accent; r.dataset.size = p.size; r.dataset.motion = p.motion;

  try{ localStorage.setItem(PREFS_KEY, JSON.stringify(p)); }catch(e){}
  applyPrefs(p); rerender();
}

/* ================= router ================= */
function route(){
  const parts = location.hash.replace(/^#\//,"").split("/");
  let view = parts[0] || (S.me.role==="student" ? "home" : "class");
  S.course = null; S.lesson = null;
  if(view==="course" || view==="edit") S.course = parts[1];
  S.gSubject = view==="genome" && parts[1] ? decodeURIComponent(parts[1]) : null;
  S.gTopic   = view==="genome" && parts[2] ? decodeURIComponent(parts[2]) : null;
  if(view==="lesson") S.lesson = parts[1];
  if(!V[view]) view = S.me.role==="student" ? "home" : "class";
  if(S.me.role!=="student" && ["home","learn","genome","examlens","mirage","doctor","portfolio","course","lesson"].includes(view))
    view = "class";
  $("#main").innerHTML = `<div class="mobiletop">
      <img class="wordmark" src="branding/EduNexus-wordmark-transparent.png" alt="EduNexus" style="height:24px">
      <a class="btn ghost sm" href="#/settings">Settings</a></div>
    <div class="fade">${V[view]()}</div>`;
  $("#aside").innerHTML = aside(view);
  buildNav();
  if(view==="counsellor"){
    renderChat();
    const i = $("#ask");
    i && i.addEventListener("keydown", e=>{ if(e.key==="Enter"){ send(i.value); i.value=""; }});
  }
  window.scrollTo(0,0);
}
const rerender = () => route();

/* Re-rendering wipes the form, so read it into the draft first.
   This is what was clearing the lesson pane when the AI ran. */
function captureDraft(){
  if(!$("#lTitle")) return;
  const d = S.cache.draft || {};
  d.title = $("#lTitle").value.trim();
  d.topic = $("#lTopic").value.trim();
  d.duration_min = Number($("#lMin").value) || 20;
  if($("#lBody"))    d.body = $("#lBody").value;
  if($("#lVideo"))   d.video_url = $("#lVideo").value.trim();
  if($("#lTrans"))   d.transcript = $("#lTrans").value;
  if($("#lSummary")) d.summary = $("#lSummary").value;
  if($("#cpQ")){
    const options = $$("[id^=cpO]").map(i=>i.value.trim()).filter(Boolean);
    d.checkpoint = { question:$("#cpQ").value.trim(), options,
      answer: Math.max(0, Math.min(options.length-1, Number($("#cpAns").value)-1)),
      explanation: (d.checkpoint && d.checkpoint.explanation) || "" };
  }
  S.cache.draft = d;
}
async function withBusy(key, fn){
  S.busy[key]=true; rerender();
  try{ await fn(); }catch(e){ toast(e.message||"Something went wrong"); }
  S.busy[key]=false; rerender();
}

/* ================= actions ================= */
const ACT = {
  async join(el){
    const { error } = await sb.from("enrollments").insert({student_id:S.me.id, course_id:el.dataset.id});
    if(error) return toast(error.message);
    S.enrolled.push(el.dataset.id); toast("Joined"); rerender();
  },
  async "answer-cp"(el){
    const l = S.lessons.find(x=>x.id===S.lesson), cp = l.checkpoint;
    const chosen = Number(el.dataset.i), right = chosen === Number(cp.answer);
    $$("[data-act=answer-cp]").forEach(b=>{ b.style.opacity=.5; b.disabled=true; });
    el.style.opacity=1; el.style.borderColor = right ? "var(--teal)" : "var(--warn-line)";
    $("#cpOut").innerHTML = `<div class="card" style="margin-top:12px;border-color:${right?"rgba(var(--accent-rgb),.4)":"var(--warn-line)"};background:${right?"var(--teal-ghost)":"var(--warn-soft)"}">
      <b class="${right?"teal-text":"warn-text"}" style="font-size:var(--fs-2)">${right?"Correct":"Not correct"}</b>
      <p class="note" style="margin:8px 0 0"><span class="spin"></span>Edu AI is looking at your reasoning…</p></div>`;
    const course = S.courses.find(c=>c.id===l.course_id);
    await record({ kind:"lesson", subject:course?course.subject:null, topic:l.topic,
                   score: right?100:0, lesson_id:l.id,
                   meta:{ chosen, question:cp.question,
                          chosenText:(cp.options||[])[chosen],
                          correctText:(cp.options||[])[cp.answer] } });
    let text = cp.explanation || "";
    try{
      const out = await ai("checkpoint",{ topic:l.topic, question:cp.question, options:cp.options,
        chosen:(cp.options||[])[chosen], correct:(cp.options||[])[cp.answer], wasRight:right });
      text = out.text || text;
    }catch(e){ text = text || "Saved. The AI explanation is unavailable right now."; }
    $("#cpOut").innerHTML = `<div class="card" style="margin-top:12px;border-color:${right?"rgba(var(--accent-rgb),.4)":"var(--warn-line)"};background:${right?"var(--teal-ghost)":"var(--warn-soft)"}">
      <b class="${right?"teal-text":"warn-text"}" style="font-size:var(--fs-2)">${right?"Correct":"Not correct"}</b>
      <p class="prose" style="margin:8px 0 0;font-size:var(--fs-2)">${esc(text)}</p>
      <div class="note" style="margin-top:10px">Recorded to your genome under ${esc(l.topic)}.</div></div>`;
  },
  "run-examlens"(){
    /* Read the form BEFORE withBusy's rerender wipes these fields — same trap
       captureDraft() exists for on the lesson editor. */
    const d = S.cache.examlensDraft = {
      subject:($("#exSub")||{}).value?.trim()||"", topic:($("#exTopic")||{}).value?.trim()||"",
      question:($("#exQ")||{}).value?.trim()||"", answer:($("#exA")||{}).value?.trim()||"",
      expected:($("#exE")||{}).value?.trim()||""
    };
    if(!d.question||!d.answer) return toast("Add the question and your answer first");
    withBusy("examlens", async ()=>{
      const out = await ai("examlens",{ question:d.question, answer:d.answer, expected:d.expected, subject:d.subject, topic:d.topic });
      S.cache.examlens = out;
      await record({ kind:"examlens", subject:d.subject, topic: out.topic||d.topic||"Unspecified topic",
        score: Number(out.score)||0,
        meta:{ cause:out.cause, verdict:out.verdict, question:d.question, answer:d.answer,
               explanation:out.explanation, correct_working:out.correct_working } });
    });
  },
  "examlens-ocr"(){
    const files = [...((($("#exPhoto")||{}).files)||[])];
    if(!files.length) return toast("Choose or take a photo first");
    const cur = S.cache.examlensDraft = {
      subject:($("#exSub")||{}).value?.trim()||"", topic:($("#exTopic")||{}).value?.trim()||"",
      question:($("#exQ")||{}).value?.trim()||"", answer:($("#exA")||{}).value?.trim()||"",
      expected:($("#exE")||{}).value?.trim()||""
    };
    withBusy("examlensOcr", async ()=>{
      const images = await Promise.all(files.slice(0,3).map(f=>fileToCompressedDataURL(f)));
      const out = await ai("examlens_ocr",{images});
      S.cache.examlensDraft = {
        subject: cur.subject || out.subject_guess || "",
        topic: cur.topic || out.topic_guess || "",
        question: out.question || cur.question || "",
        answer: out.answer || cur.answer || "",
        expected: out.expected || cur.expected || ""
      };
      toast("Read from photo — check it's right, then Analyse");
    });
  },
  "mirage-generate"(){
    const d = S.cache.mirageDraft = {
      topic: ($("#miTopic")||{}).value?.trim()||"", subject: ($("#miSub")||{}).value?.trim()||""
    };
    if(!d.topic) return toast("Choose a topic first");
    withBusy("mirage", async ()=>{
      const out = await ai("mirage_generate",{ topic:d.topic, subject:d.subject });
      S.cache.mirage = { topic:d.topic, subject:d.subject, questions: out.questions || [], answers:[], results:null };
    });
  },
  "mirage-mark"(){
    const m = S.cache.mirage;
    m.answers = m.questions.map((_,i)=> ($("#mi"+i)||{}).value || "");
    withBusy("mirageMark", async ()=>{
      const out = await ai("mirage_mark",{ topic:m.topic,
        answers: m.questions.map((q,i)=>({ ...q, answer:m.answers[i] })) });
      m.results = out.results || []; m.verdict = out.verdict; m.root_cause = out.root_cause;
      const lv = n => m.results.find(r=>r.level===n) || {score:0};
      const genuine = Math.round((lv(4).score + lv(5).score)/2);
      const apparent = Math.round((lv(1).score+lv(2).score)/2);
      const breakdown = m.questions.map((q,i)=>({
        level:q.level, label:q.label, question:q.question, expected:q.expected,
        answer:m.answers[i], score:(m.results[i]||{}).score, note:(m.results[i]||{}).note
      }));
      await record({ kind:"mirage", subject:m.subject, topic:m.topic, score:genuine,
        meta:{ apparent, genuine, verdict:m.verdict, root_cause:m.root_cause, breakdown } });
    });
  },
  "run-doctor"(){ withBusy("doctor", async ()=>{
    const since = Date.now()-1000*60*60*24*14;
    const session = S.attempts.filter(a=>new Date(a.created_at).getTime()>since)
      .map(a=>({kind:a.kind, topic:a.topic, score:a.score, seconds:a.seconds}));
    S.cache.doctor = await ai("doctor",{ session });
  });},
  "run-advisor"(){ withBusy("advisor", async ()=>{ S.cache.advisor = await ai("advisor",{}); });},
  send(){ const i=$("#ask"); send(i.value); i.value=""; },
  ask(el){ send(el.dataset.q); },
  async "save-profile"(){
    const interests = $("#pInt").value.split(",").map(s=>s.trim()).filter(Boolean);
    const patch = { goal:$("#pGoal").value.trim(), grade:$("#pGrade").value.trim(), interests };
    const { error } = await sb.from("profiles").update(patch).eq("id",S.me.id);
    if(error) return toast(error.message);
    Object.assign(S.me, patch); toast("Saved"); rerender();
  },
  async "add-portfolio"(){
    const title = $("#poTitle").value.trim();
    if(!title) return toast("Give it a title");
    const row = { student_id:S.me.id, title, kind:$("#poKind").value,
      description:$("#poDesc").value.trim(), link:$("#poLink").value.trim()||null };
    const { data, error } = await sb.from("portfolio_items").insert(row).select().single();
    if(error) return toast(error.message);
    S.portfolio.unshift(data); toast("Added"); rerender();
  },
  async "toggle-portfolio"(el){
    const p = S.portfolio.find(x=>x.id===el.dataset.id);
    const { error } = await sb.from("portfolio_items").update({visible:!p.visible}).eq("id",p.id);
    if(error) return toast(error.message);
    p.visible = !p.visible; rerender();
  },
  async "del-portfolio"(el){
    const { error } = await sb.from("portfolio_items").delete().eq("id",el.dataset.id);
    if(error) return toast(error.message);
    S.portfolio = S.portfolio.filter(x=>x.id!==el.dataset.id); rerender();
  },
  /* ---- teacher ---- */
  async "create-course"(){
    const title=$("#cTitle").value.trim(), subject=$("#cSubject").value.trim();
    if(!title||!subject) return toast("Title and subject are needed");
    const { data, error } = await sb.from("courses").insert({ teacher_id:S.me.id, title, subject,
      code:$("#cCode").value.trim()||null, description:$("#cDesc").value.trim()||null,
      published:true }).select().single();
    if(error) return toast(/does not exist|schema cache/i.test(error.message)
      ? "The courses table is missing. Run the newer schema.sql in Supabase, then reload."
      : error.message);
    S.courses.unshift(data); toast("Course created"); location.hash = "#/edit/"+data.id;
  },
  async "toggle-course"(el){
    const c = S.courses.find(x=>x.id===el.dataset.id);
    const { error } = await sb.from("courses").update({published:!c.published}).eq("id",c.id);
    if(error) return toast(error.message);
    c.published = !c.published; toast(c.published?"Published to students":"Unpublished"); rerender();
  },
  "ai-lesson"(){ captureDraft(); withBusy("aiLesson", async ()=>{
    const c = S.courses.find(x=>x.id===S.course), d = S.cache.draft || {};
    if(!d.title || !d.topic) throw new Error("Add a lesson title and topic first");
    const out = await ai("generate_lesson",{ subject:c.subject, title:d.title, topic:d.topic });
    S.cache.draft = { ...d, body: out.body };
  });},
  "ai-checkpoint"(){ captureDraft(); withBusy("aiCp", async ()=>{
    const c = S.courses.find(x=>x.id===S.course), d = S.cache.draft || {};
    if(!d.title || !d.topic) throw new Error("Add a lesson title and topic first");
    const cp = await ai("generate_checkpoint",{ subject:c.subject, title:d.title, topic:d.topic,
      body: d.transcript ? (d.body||"") + "\n\nVideo transcript:\n" + d.transcript : (d.body||"") });
    S.cache.draft = { ...d, checkpoint: cp };
  });},
  "fetch-captions"(){ captureDraft(); withBusy("captions", async ()=>{
    const d = S.cache.draft || {};
    if(!d.video_url) throw new Error("Paste a video link first");
    const out = await ai("video_transcript",{ url:d.video_url });
    S.cache.draft = { ...d, transcript: out.transcript };
    toast("Captions read — " + out.transcript.split(/\s+/).length + " words");
  });},
  "summarise-video"(){ captureDraft(); withBusy("summarise", async ()=>{
    const c = S.courses.find(x=>x.id===S.course), d = S.cache.draft || {};
    if(!d.transcript) throw new Error("Read the video or paste a transcript first");
    const out = await ai("summarise_video",{ subject:c.subject, title:d.title, topic:d.topic, transcript:d.transcript });
    const points = (out.key_points||[]).map(k=>"• "+k).join("\n");
    S.cache.draft = { ...d,
      summary: out.summary || d.summary,
      body: [out.notes, points].filter(Boolean).join("\n\n") || d.body,
      checkpoint: out.checkpoint || d.checkpoint };
    toast("Summary, notes and checkpoint written from the video");
  });},
  "clear-draft"(){ S.cache.draft = null; rerender(); },
  "toggle-transcript"(el){
    const t = $("#trans"); if(!t) return;
    const open = t.style.display !== "none";
    t.style.display = open ? "none" : "block";
    el.textContent = open ? "Show transcript" : "Hide transcript";
  },
  async "add-lesson"(){
    captureDraft();
    const c = S.courses.find(x=>x.id===S.course), d = S.cache.draft || {};
    if(!d.title || !d.topic) return toast("Lesson title and topic are needed");
    const position = S.lessons.filter(l=>l.course_id===c.id).length + 1;
    const { data, error } = await sb.from("lessons").insert({
      course_id:c.id, title:d.title, topic:d.topic, position, duration_min:d.duration_min||20,
      body:d.body||null, video_url:d.video_url||null, transcript:d.transcript||null,
      summary:d.summary||null, checkpoint:d.checkpoint||null, published:true
    }).select().single();
    if(error) return toast(error.message);
    S.lessons.push(data); S.cache.draft = null;
    if(!c.published){
      const up = await sb.from("courses").update({published:true}).eq("id",c.id);
      if(!up.error){ c.published = true; toast("Lesson added — course published, students can see it now"); }
      else toast("Lesson added, but the course is still a draft: "+up.error.message);
    } else {
      toast("Lesson added and visible to students");
    }
    rerender();
  },
  async "toggle-lesson"(el){
    const l = S.lessons.find(x=>x.id===el.dataset.id);
    const { error } = await sb.from("lessons").update({published:!l.published}).eq("id",l.id);
    if(error) return toast(error.message);
    l.published = !l.published; rerender();
  },
  async "del-lesson"(el){
    const { error } = await sb.from("lessons").delete().eq("id",el.dataset.id);
    if(error) return toast(error.message);
    S.lessons = S.lessons.filter(x=>x.id!==el.dataset.id); rerender();
  },
  drill(el){ location.hash = el.dataset.to; },
  pref(el){ setPref(el.dataset.k, el.dataset.v); },
  "cust-tab"(el){ S.custTab = el.dataset.t; rerender(); },
  async banner(el){ if(await saveProfile({ banner: el.dataset.id })){ toast("Banner equipped"); rerender(); } },
  "banner-locked"(el){ const b = bannerOf(el.dataset.id); toast(`${b.name} is locked — ${b.unlock.text.toLowerCase()} to unlock it`); },
  "badge-locked"(el){ const b = badgesFor(myBadgeCtx()).find(x=>x.id===el.dataset.id); if(b) toast(`Locked: ${b.desc}`); },
  async "badge-toggle"(el){
    const id = el.dataset.id, cur = [...(S.me.badges_shown||[])];
    const earned = new Set(badgesFor(myBadgeCtx()).filter(b=>b.earned).map(b=>b.id));
    const clean = cur.filter(x=>earned.has(x));            // drop anything no longer earned
    let next;
    if(clean.includes(id)) next = clean.filter(x=>x!==id);
    else if(clean.length >= 3) return toast("Only 3 badges fit on your banner. Take one off first.");
    else next = [...clean, id];
    if(await saveProfile({ badges_shown: next })){ toast(next.includes(id)?"Added to your banner":"Removed from your banner"); rerender(); }
  },
  async "avatar-remove"(){
    const old = S.me.avatar_url;
    if(await saveProfile({ avatar_url:null })){
      const path = old && old.split("/avatars/")[1];
      if(path) sb.storage.from("avatars").remove([path]);
      toast("Photo removed"); rerender();
    }
  },
  "reset-prefs"(){ try{ localStorage.removeItem(PREFS_KEY); }catch(e){} applyPrefs(getPrefs()); rerender(); toast("Back to the default look"); },
  refresh(){ withBusy("refresh", async ()=>{
    S.me.role==="student" ? await loadStudent() : await loadTeacher();
    toast("Up to date");
  });},
  "view-student"(el){ S.viewing = el.dataset.id; location.hash = "#/student"; }
};
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const fn = ACT[el.dataset.act];
  if(fn){ e.preventDefault(); fn(el); }
});
window.addEventListener("hashchange", route);

/* ================= boot ================= */
async function loadStudent(){
  const [{data:courses},{data:enrol},{data:attempts},{data:port}] = await Promise.all([
    sb.from("courses").select("*").eq("published",true).order("created_at",{ascending:false}),
    sb.from("enrollments").select("course_id").eq("student_id",S.me.id),
    sb.from("attempts").select("*").eq("student_id",S.me.id).order("created_at",{ascending:false}).limit(300),
    sb.from("portfolio_items").select("*").eq("student_id",S.me.id).order("created_at",{ascending:false})
  ]);
  S.courses = courses||[]; S.enrolled = (enrol||[]).map(e=>e.course_id);
  S.attempts = attempts||[]; S.portfolio = port||[];
  const ids = S.courses.map(c=>c.id);
  if(ids.length){
    const { data:lessons } = await sb.from("lessons").select("*").in("course_id",ids).eq("published",true);
    S.lessons = lessons||[];
  }
}
async function loadTeacher(){
  const [{data:courses},{data:students}] = await Promise.all([
    sb.from("courses").select("*").eq("teacher_id",S.me.id).order("created_at",{ascending:false}),
    sb.from("profiles").select("id, full_name, grade, created_at, avatar_url, banner, badges_shown").eq("role","student").order("full_name")
  ]);
  S.courses = courses||[]; S.students = students||[];
  const ids = S.courses.map(c=>c.id);
  if(ids.length){
    const [{data:lessons},{data:enrol}] = await Promise.all([
      sb.from("lessons").select("*").in("course_id",ids),
      sb.from("enrollments").select("*").in("course_id",ids)
    ]);
    S.lessons = lessons||[]; S.enrollRows = enrol||[];
  }
  const { data:att } = await sb.from("attempts").select("*").order("created_at",{ascending:false}).limit(1000);
  S.classAttempts = att||[];
  const [lg, pf, en] = await Promise.all([
    sb.from("login_days").select("user_id, day"),
    sb.from("portfolio_items").select("student_id"),
    sb.from("enrollments").select("student_id")
  ]);
  S.classLogins = lg.data||[]; S.classPortfolio = pf.data||[]; S.allEnrol = en.data||[];
}
async function boot(){
  if(!sb){
    $("#gate").innerHTML = `<div style="max-width:380px;text-align:center;padding:20px">
      <b style="color:var(--ink)">Not connected</b>
      <p style="margin-top:8px">${esc(configProblem)}</p></div>`;
    return;
  }
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ location.replace("login.html"); return; }
  const { data:profile, error } = await sb.from("profiles").select("*").eq("id",session.user.id).single();
  if(error || !profile){
    $("#gate").innerHTML = `<div style="text-align:center;padding:20px">Your profile row is missing. Run schema.sql, then sign in again.
      <br><br><button class="btn" onclick="signOut()">Sign out</button></div>`;
    return;
  }
  S.me = profile;

  // Is the v2 schema actually there?
  const probe = await sb.from("courses").select("id").limit(1);
  if(probe.error){
    const missing = /does not exist|schema cache|relation/i.test(probe.error.message);
    $("#gate").innerHTML = `<div style="max-width:460px;padding:24px;text-align:center">
      <b style="color:var(--ink);font-size:16px">${missing?"The database is out of date":"Cannot read the database"}</b>
      <p style="margin-top:10px;line-height:1.6">${missing
        ? "This version needs the newer schema.sql, with the courses, lessons and attempts tables. Open Supabase → SQL Editor, paste the whole of schema.sql, and run it. Then reload this page."
        : esc(probe.error.message)}</p>
      <p style="margin-top:10px;font-size:11px">If you have just run it and still see this, go to Settings → API and click Reload schema cache.</p>
      <button class="btn" style="margin-top:14px" onclick="location.reload()">Reload</button>
      <button class="btn ghost" style="margin-top:8px" onclick="signOut()">Sign out</button></div>`;
    return;
  }

  try{
    const d = new Date(), today = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    await sb.from("login_days").upsert({ user_id:S.me.id, day:today }, { onConflict:"user_id,day", ignoreDuplicates:true });
    const { data:days } = await sb.from("login_days").select("day").eq("user_id",S.me.id).order("day",{ascending:false}).limit(400);
    S.loginDays = (days||[]).map(r=>r.day);
  }catch(e){ S.loginDays = []; }
  S.badgesBefore = null;
  try{ S.me.role==="student" ? await loadStudent() : await loadTeacher(); }
  catch(e){ toast("Could not load your data: "+e.message); }
  $("#whoami").innerHTML = `${esc(S.me.full_name)}<br><span style="color:var(--teal)">${esc(S.me.role)}</span>`;
  $("#signout").onclick = signOut;
  $("#gate").remove();
  $("#shell").style.visibility = "visible";
  if(!location.hash) location.hash = S.me.role==="student" ? "#/home" : "#/class";
  route();
}
async function signOut(){ await sb.auth.signOut(); location.replace("login.html"); }
boot();
</script>
