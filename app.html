<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduNexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@700&family=Caveat:wght@700&family=Playfair+Display:ital,wght@0,700;1,800&family=JetBrains+Mono:wght@700&family=Orbitron:wght@800&family=Press+Start+2P&family=Bungee&family=Cinzel:wght@800&display=swap" rel="stylesheet">
<script>
/* Runs before the page draws, so there is no flash of the wrong theme. */
(function(){
  try{
    var p = JSON.parse(localStorage.getItem("edunexus-prefs") || "{}"), r = document.documentElement;
    var t = p.theme || "dark";
    if(t === "system") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    r.dataset.theme = t; r.dataset.accent = p.accent || "teal";
    r.dataset.size = p.size || "normal"; r.dataset.motion = p.motion || "full";
  }catch(e){}
})();
</script>
<style>
:root{
  /* Midnight — the original look */
  --bg:#040a09; --bg2:#070f0e; --panel:#0a1614; --panel2:#0d1d1a;
  --line:#153630; --line-soft:#102520; --bar:rgba(7,15,14,.96);
  --accent-rgb:47,227,192; --teal:#2fe3c0; --teal-dim:#1c8c78; --teal-ghost:rgba(var(--accent-rgb),.10);
  --on-accent:#032019;
  --ink:#e6f6f2; --ink-2:#a9c8c1; --mute:#6f918a;
  --warn:#f08a5d; --warn-soft:rgba(240,138,93,.12); --warn-line:rgba(240,138,93,.45);
  --r:14px; --r-sm:10px;
  --fs-1:11px; --fs-2:12.5px; --fs-3:14px; --fs-4:16px; --fs-5:20px; --fs-6:26px; --fs-7:34px;
  color-scheme:dark;
}
/* Light */
:root[data-theme="light"]{
  --bg:#f4f8f7; --bg2:#eaf2f0; --panel:#ffffff; --panel2:#f1f7f5;
  --line:#cfe1dc; --line-soft:#e1ece9; --bar:rgba(255,255,255,.96);
  --accent-rgb:14,150,125; --teal:#0e967d; --teal-dim:#7fcdbd;
  --on-accent:#ffffff;
  --ink:#0c201c; --ink-2:#36524c; --mute:#688680;
  --warn:#cc5a26; --warn-soft:rgba(204,90,38,.09); --warn-line:rgba(204,90,38,.4);
  color-scheme:light;
}
/* Accents. The orange warning colour never changes: it only ever means "weak". */
:root[data-accent="sky"]    {--accent-rgb:92,190,255;  --teal:#5cbeff; --teal-dim:#2a6f9c; --on-accent:#021726;}
:root[data-accent="violet"] {--accent-rgb:176,140,255; --teal:#b08cff; --teal-dim:#6848b0; --on-accent:#160a33;}
:root[data-accent="lime"]   {--accent-rgb:176,230,90;  --teal:#b0e65a; --teal-dim:#5f8a24; --on-accent:#162205;}
:root[data-theme="light"][data-accent="sky"]    {--accent-rgb:14,116,184;  --teal:#0e74b8; --teal-dim:#8cc3e6; --on-accent:#fff;}
:root[data-theme="light"][data-accent="violet"] {--accent-rgb:112,72,210;  --teal:#7048d2; --teal-dim:#c3b0f0; --on-accent:#fff;}
:root[data-theme="light"][data-accent="lime"]   {--accent-rgb:74,124,20;   --teal:#4a7c14; --teal-dim:#b6d88a; --on-accent:#fff;}
/* Text size */
:root[data-size="compact"]{--fs-1:10px;--fs-2:11.5px;--fs-3:13px;--fs-4:15px;--fs-5:18px;--fs-6:23px;--fs-7:30px;}
:root[data-size="large"]  {--fs-1:12.5px;--fs-2:14px;--fs-3:16px;--fs-4:18px;--fs-5:22px;--fs-6:29px;--fs-7:38px;}
:root[data-motion="reduced"] *{animation:none!important;transition:none!important;}
/* The wordmark is teal on transparent; darken it enough to read on white. */
.wordmark{display:block;height:30px;width:auto;max-width:100%}
:root[data-theme="light"] .wordmark{filter:brightness(.62) saturate(1.3)}

/* ---- player banner ---- */
.pbanner{position:relative;border-radius:18px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;
  gap:16px;flex-wrap:wrap;color:#fff;border:1px solid rgba(255,255,255,.12);overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 30px rgba(0,0,0,.25);background-size:auto;}
.pbanner::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.35),transparent 55%);pointer-events:none}
.pbanner > *{position:relative;z-index:1}
.pbanner{min-height:148px}
.pbanner.small{min-height:0}
/* the legendary banner moves: a slow sheen sweeps across it */
.shine{position:relative;overflow:hidden}
.shine::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 35%,rgba(170,255,235,.22) 48%,rgba(200,170,255,.18) 52%,transparent 65%);
  background-size:260% 100%;animation:sheen 7s linear infinite}
@keyframes sheen{from{background-position:130% 0}to{background-position:-130% 0}}
:root[data-motion="reduced"] .shine::before{animation:none;opacity:0}
.bn-tile{height:104px}
/* ---- avatar borders ---- */
.pb-ring{padding:0;background:none}
.br-frame{position:relative;display:inline-grid;place-items:center;padding:var(--pad);border-radius:50%;flex:none;
  box-shadow:0 0 0 1px rgba(0,0,0,.25), 0 0 18px -2px var(--glow, transparent)}
.br-ring{position:absolute;inset:0;border-radius:50%;z-index:0}
.br-frame.br-spinning .br-ring{animation:brspin 6s linear infinite}
@keyframes brspin{to{transform:rotate(360deg)}}
.br-frame > .avatar{position:relative;z-index:1;border:2px solid rgba(0,0,0,.45)}
.br-deco{position:absolute;z-index:2;pointer-events:none}
.br-deco.crown{width:46%;top:-26%;left:27%;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.br-deco.stars{inset:-10%}
.br-deco.stars i{position:absolute;width:6px;height:6px;border-radius:50%;background:#e8fbff;box-shadow:0 0 8px 2px #6af0ff;animation:twinkle 2.4s ease-in-out infinite}
.br-deco.stars i:nth-child(1){top:4%;right:14%}
.br-deco.stars i:nth-child(2){bottom:10%;left:2%;animation-delay:.8s}
.br-deco.stars i:nth-child(3){top:40%;right:-2%;width:4px;height:4px;animation-delay:1.5s}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
:root[data-motion="reduced"] .br-frame.br-spinning .br-ring,:root[data-motion="reduced"] .br-deco.stars i{animation:none}
.br-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px}
.br-tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:42px 10px 14px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--bg2);transition:border-color .15s,transform .15s}
.br-tile:hover{border-color:rgba(var(--accent-rgb),.45)}
.br-tile.on{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal) inset;background:var(--teal-ghost)}
.br-tile.locked .br-frame{filter:grayscale(1) brightness(.7)}
.br-tile.locked{cursor:default}
.br-tile.r-legendary{box-shadow:0 0 0 1px rgba(255,224,138,.35)}
.br-name{font-weight:700;font-size:var(--fs-2)}
/* ---- name styles ---- */
.pb-name[class*="ns-"]{line-height:1.15;padding:2px 0}
.pb-name.ns-mint{color:#7ff5de}
.pb-name.ns-modern{font-family:"Space Grotesk",sans-serif;letter-spacing:-.01em;color:#dff4ff}
.pb-name.ns-hand{font-family:"Caveat",cursive;font-size:calc(var(--fs-5) * 1.3);letter-spacing:0;color:#fff2dc;font-weight:700}
.pb-name.ns-scholar{font-family:"Playfair Display",serif;font-style:italic;letter-spacing:0;color:#f3e2b8}
.pb-name.ns-sunset,.pb-name.ns-blaze,.pb-name.ns-glacial,.pb-name.ns-royal,.pb-name.ns-aurora{-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-fill-color:transparent;text-shadow:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.45))}
.pb-name.ns-sunset{background-image:linear-gradient(90deg,#ffd27a,#ff7e6b 55%,#e06bd1)}
.pb-name.ns-terminal{font-family:"JetBrains Mono",ui-monospace,monospace;letter-spacing:0;color:#6bff9a;text-shadow:0 0 8px rgba(107,255,154,.55)}
.pb-name.ns-terminal::after{content:"_";animation:caret 1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.pb-name.ns-neon{font-family:"Orbitron",sans-serif;letter-spacing:.04em;color:#ffe6fb;
  text-shadow:0 0 4px #fff,0 0 10px #ff4fd8,0 0 22px #ff4fd8,0 0 38px #b000ff;animation:flicker 5s infinite}
@keyframes flicker{0%,19%,21%,62%,64%,100%{opacity:1}20%,63%{opacity:.55}}
.pb-name.ns-arcade{font-family:"Press Start 2P",monospace;font-size:calc(var(--fs-5) * .72);letter-spacing:0;line-height:1.5;
  color:#ffe066;text-shadow:3px 3px 0 #d6336c,6px 6px 0 rgba(0,0,0,.35)}
.pb-name.ns-blaze{font-family:"Bungee",sans-serif;letter-spacing:.02em;font-weight:400;
  background-image:linear-gradient(0deg,#b3200f,#ff7a1a 45%,#ffdf6b 80%,#fff6c2);background-size:100% 200%;animation:blaze 1.6s ease-in-out infinite alternate}
@keyframes blaze{from{background-position:0 0}to{background-position:0 100%}}
.pb-name.ns-glacial{font-family:"Cinzel",serif;letter-spacing:.06em;
  background-image:linear-gradient(100deg,#e6fbff 20%,#62c6f0 40%,#ffffff 50%,#62c6f0 60%,#e6fbff 80%);background-size:250% 100%;animation:glint 4.5s linear infinite}
.pb-name.ns-royal{font-family:"Cinzel",serif;letter-spacing:.06em;
  background-image:linear-gradient(100deg,#c9901c 20%,#ffe08a 40%,#fff6d6 50%,#ffe08a 60%,#c9901c 80%);background-size:250% 100%;animation:glint 3.5s linear infinite;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.55)) drop-shadow(0 0 10px rgba(255,214,107,.35))}
@keyframes glint{from{background-position:130% 0}to{background-position:-130% 0}}
.pb-name.ns-aurora{background-image:linear-gradient(90deg,#37ffd0,#6af0ff,#9b7bff,#ff8ad8,#37ffd0);background-size:300% 100%;animation:auroraName 6s linear infinite;
  filter:drop-shadow(0 0 10px rgba(106,240,255,.55)) drop-shadow(0 2px 4px rgba(0,0,0,.45))}
@keyframes auroraName{from{background-position:0 0}to{background-position:300% 0}}
:root[data-motion="reduced"] [class*="ns-"],:root[data-motion="reduced"] .ns-terminal::after{animation:none!important}
.ns-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.ns-tile{position:relative;display:flex;flex-direction:column;gap:10px;text-align:left;padding:34px 12px 12px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--bg2);transition:border-color .15s}
.ns-tile:hover{border-color:rgba(var(--accent-rgb),.45)}
.ns-tile.on{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal) inset}
.ns-tile.locked{cursor:default}
.ns-tile.locked .ns-stage{filter:grayscale(1) brightness(.75)}
.ns-tile.r-legendary{box-shadow:0 0 0 1px rgba(255,224,138,.35)}
.ns-stage{display:flex;align-items:center;min-height:62px;padding:10px 12px;border-radius:10px;overflow:hidden;color:#fff;
  background:linear-gradient(120deg,#062420,#0b3a33 60%,#0a1f2e)}
.ns-stage .pb-name{font-size:var(--fs-4)}
.ns-stage .pb-name.ns-hand{font-size:calc(var(--fs-4) * 1.3)}
.ns-stage .pb-name.ns-arcade{font-size:calc(var(--fs-4) * .72)}
/* ---- teacher identity: quiet and professional ---- */
.pbanner.pb-teacher{box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 6px 18px rgba(0,0,0,.18)}
.pbanner.pb-teacher::after{background:none}
.pbanner.pb-light{color:#1a1f24;border-color:rgba(0,0,0,.08)}
.pbanner.pb-light .pb-name{color:#15191d;text-shadow:none}
.pbanner.pb-light .pb-sub{color:#4d5761}
.pbanner.pb-inset{box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),inset 0 0 0 7px #0b0b0c,inset 0 0 0 8px rgba(255,255,255,.1)}
.bn-tile.t-tile{height:88px}
.bn-tile.light .bn-name{color:#15191d;text-shadow:none}
.br-frame.br-double{background:none}
.br-frame.br-double .br-ring{box-shadow:inset 0 0 0 2px #e9ecef;background:transparent!important}
.br-frame.br-double::after{content:"";position:absolute;inset:calc(var(--pad) - 4px);border-radius:50%;box-shadow:inset 0 0 0 1.5px #e9ecef;z-index:0}
.br-frame.br-none{box-shadow:none}
.pb-name.ns-t-standard{font-weight:700;letter-spacing:-.01em}
.pb-name.ns-t-serif{font-family:"Playfair Display",Georgia,serif;font-style:normal;font-weight:700;letter-spacing:0}
.pb-name.ns-t-caps{text-transform:uppercase;letter-spacing:.14em;font-size:calc(var(--fs-5) * .78);font-weight:700}
.pb-name.ns-t-light{font-weight:500;letter-spacing:-.02em}
.pb-name.ns-t-grotesk{font-family:"Space Grotesk",sans-serif;font-weight:700;letter-spacing:-.01em}
.pb-name.ns-t-mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:700;letter-spacing:0;font-size:calc(var(--fs-5) * .88)}
.ns-stage.t-stage{background:linear-gradient(135deg,#1b242e,#232f3b)}
.ns-stage.t-stage .pb-name{color:#f2f4f6;text-shadow:none}
/* ---- teaching assistant ---- */
.ta-wrap{display:block}
.only-narrow{display:none}
@media (max-width:1180px){ .only-narrow{display:block} }
.mem-list{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.mem-item{display:flex;align-items:flex-start;gap:9px;padding:9px 10px;border-radius:10px;background:var(--bg2);border:1px solid var(--line-soft)}
.mem-dot{flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--teal)}
.mem-dot.you{background:var(--ink-2)}
.mem-note{flex:1;font-size:var(--fs-2);line-height:1.5}
.mem-x{flex:none;color:var(--mute);font-size:12px;padding:2px 4px;border-radius:6px}
.mem-x:hover{color:var(--ink);background:var(--panel2)}
.mem-add{display:flex;gap:8px;margin-top:12px}
.mem-add input{padding:9px 12px}

.ns-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:var(--fs-2)}
.bn-rar{position:absolute;top:9px;right:10px;font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  padding:2px 7px;border-radius:99px;background:rgba(0,0,0,.5)}
.bn-tile.r-legendary{box-shadow:0 0 0 1px rgba(255,224,138,.45),0 0 22px -6px rgba(255,224,138,.6)}
.bn-tile.r-legendary.locked{box-shadow:0 0 0 1px rgba(255,224,138,.25)}
.bn-tile .bn-name{position:relative}
.legend-hint{border-color:rgba(255,224,138,.35)}
.pb-left{display:flex;align-items:center;gap:14px;min-width:0}
.pb-ring{padding:3px;border-radius:50%;background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(255,255,255,.25));flex:none}
.pb-ring .avatar{border:2px solid rgba(0,0,0,.35);background:#0d1d1a;color:#fff}
.pb-name{font-size:var(--fs-5);font-weight:800;letter-spacing:-.02em;text-shadow:0 2px 8px rgba(0,0,0,.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb-sub{font-size:var(--fs-2);color:rgba(255,255,255,.78)}
.pb-stat{display:inline-block;margin-top:6px;font-size:var(--fs-1);font-weight:700;padding:3px 9px;border-radius:99px;background:rgba(0,0,0,.35);color:#fff}
.pb-badges{display:flex;gap:10px}
.pb-slot{width:78px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:12px;background:rgba(0,0,0,.28);
  border:1px solid rgba(255,255,255,.14)}
.pb-slot span{font-size:10px;font-weight:700;text-align:center;line-height:1.2;color:#fff}
.pb-slot.empty{border-style:dashed;justify-content:center;min-height:78px}
.pb-slot.empty span{color:rgba(255,255,255,.5)}
.pbanner.small{padding:12px 14px;border-radius:14px}
.pbanner.small .pb-name{font-size:var(--fs-4)}
.pbanner.small .pb-slot{width:54px;padding:5px 3px}
.pbanner.small .pb-slot span{display:none}
.pbanner.small .pb-slot.empty{min-height:48px}
@media (max-width:600px){ .pb-badges{width:100%;justify-content:space-between} .pb-slot{flex:1;width:auto} }
/* ---- customiser ---- */
.bn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.bn-tile{position:relative;height:84px;border-radius:14px;border:2px solid transparent;text-align:left;padding:10px;color:#fff;overflow:hidden}
.bn-tile.on{border-color:var(--teal)}
.bn-tile.locked{filter:saturate(.35) brightness(.7)}
.bn-name{font-weight:800;font-size:var(--fs-3);text-shadow:0 2px 6px rgba(0,0,0,.5)}
.bn-lock{position:absolute;left:10px;bottom:9px;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:rgba(0,0,0,.55);color:#fff}
.bd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.bd-card{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:14px 10px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--bg2)}
.bd-card.on{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal) inset;background:var(--teal-ghost)}
.bd-card.locked{cursor:default}
.bd-name{font-weight:700;font-size:var(--fs-2)}
.bd-tier{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}

/* ================= form controls (all screens) =================
   Inputs with no type attribute weren't matched before and rendered as
   unstyled grey browser boxes. */
input:not([type]),input[type=text],input[type=email],input[type=url],input[type=search],input[type=password],input[type=number],select,textarea{
  width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  color:var(--ink);font:inherit;font-size:var(--fs-2);}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:transparent}
input::placeholder,textarea::placeholder{color:var(--mute)}
input[type=file]{font:inherit;font-size:var(--fs-2);color:var(--mute);max-width:100%}
input[type=file]::file-selector-button{font:inherit;font-weight:700;font-size:var(--fs-2);margin-right:10px;padding:8px 13px;
  border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer}
.btn{white-space:nowrap}
.chip{white-space:nowrap}

/* ================= "More" sheet ================= */
.sheet-back{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);opacity:0;transition:opacity .18s}
.sheet-back.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--panel);border-top:1px solid var(--line);
  border-radius:20px 20px 0 0;padding:8px 14px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .18s ease-out;max-height:80vh;overflow:auto}
.sheet.open{transform:none}
.sheet-grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:4px auto 12px}
.sheet-who{display:flex;align-items:center;gap:12px;padding:6px 8px 14px;border-bottom:1px solid var(--line-soft);margin-bottom:6px}
.sheet a{display:flex;align-items:center;gap:13px;padding:14px 10px;border-radius:12px;font-weight:600;color:var(--ink-2);font-size:var(--fs-3)}
.sheet a.on{background:var(--teal-ghost);color:var(--teal)}
.sheet-out{width:100%;margin-top:8px;padding:14px;border-radius:12px;border:1px solid var(--line);font-weight:700;color:var(--ink-2)}

/* ================= phones ================= */
@media (max-width:860px){
  /* iOS zooms into any field under 16px when tapped; this stops that. */
  input:not([type=file]),select,textarea{font-size:16px}
  /* Belt and braces against a stray pixel of sideways scroll. "clip", unlike
     "hidden", doesn't turn body into a scroll box, so sticky headers keep working. */
  html,body{overflow-x:clip}

  .main{padding:14px 14px calc(92px + env(safe-area-inset-bottom))}
  .mobiletop{position:sticky;top:0;z-index:15;margin:-14px -14px 14px;padding:10px 14px;
    background:var(--bar);border-bottom:1px solid var(--line-soft);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

  /* bottom bar: bigger targets, labels that never wrap */
  .mobilebar{padding:6px 4px calc(6px + env(safe-area-inset-bottom));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .mobilebar a{min-height:50px;justify-content:center;border-radius:12px;font-size:10.5px}
  .mobilebar a span{white-space:nowrap}
  .mobilebar a.on{background:var(--teal-ghost)}

  /* headings: title on its own line, actions underneath when they don't fit */
  .topbar{flex-wrap:wrap;gap:10px;margin-bottom:16px}
  .topbar > div:first-child{flex:1 1 230px;min-width:0}
  .h1{font-size:var(--fs-6);word-break:break-word}
  .crumb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* stat tiles two-up instead of one tall column; an odd one out spans the row */
  .grid.g3:has(> .stat),.grid.g4:has(> .stat){grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .grid.g3 > .stat:last-child:nth-child(odd),.grid.g4 > .stat:last-child:nth-child(odd){grid-column:1 / -1}
  .stat{padding:11px 12px}
  .stat .v{font-size:var(--fs-5)}

  /* touch targets: 40px minimum */
  .btn{min-height:40px}
  .btn.sm{min-height:36px;padding:8px 13px}
  .tabs button{padding:9px 15px}
  .tabs{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-left:-2px;padding:2px}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:none}
  .list .item{padding:12px 10px}
  .suggests button{padding:9px 13px}

  /* rows that must be allowed to break */
  .wrap-sm{flex-wrap:wrap}
  .wrap-sm > :last-child{margin-left:auto}
  .wrap-sm > .row:first-child{flex-wrap:nowrap;min-width:0;flex:1 1 200px}
  .topbar > .avatar{display:none}   /* already in the phone header */

  /* Edu AI: the message box stays above the tab bar while you scroll */
  .composer{position:sticky;bottom:calc(70px + env(safe-area-inset-bottom));z-index:5;margin:16px -14px 0;padding:10px 14px;
    background:var(--bar);border-top:1px solid var(--line-soft);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .msg{max-width:88%}

  .cmp{grid-template-columns:1fr}
  /* long answer options and full-width buttons must wrap, not push off-screen */
  .grid > .btn,.btn[style*="text-align:left"]{white-space:normal;line-height:1.4;padding-top:11px;padding-bottom:11px}
  .suggests button{min-height:38px}
  /* small labels that were under 11px */
  .pb-slot span,.bd-tier,.bn-lock{font-size:11px}
  .note{font-size:max(var(--fs-1),11.5px)}
  .card{padding:14px}
  .prose{font-size:15px;line-height:1.7}
}

<script>
/* ==================================================================
   EduNexus — real data app.
   Every screen reads rows this account owns. Nothing is invented.
================================================================== */
const CFG = window.EDUNEXUS_CONFIG || {};
let sb = null, configProblem = null;

/* Mirrors login.html: "Keep me signed in" decides whether the session token
   lives in localStorage (survives closing the browser) or sessionStorage
   (cleared when the tab closes, not shared with other tabs). */
const REMEMBER_KEY = "edunexus_remember";
const rememberOn = () => localStorage.getItem(REMEMBER_KEY) !== "0";
const authStorage = {
  getItem: k => (rememberOn() ? localStorage : sessionStorage).getItem(k),
  setItem: (k,v) => (rememberOn() ? localStorage : sessionStorage).setItem(k,v),
  removeItem: k => (rememberOn() ? localStorage : sessionStorage).removeItem(k),
};
(function connect(){
  const url = (CFG.SUPABASE_URL||"").trim().replace(/\/+$/,""), key = (CFG.SUPABASE_ANON_KEY||"").trim();
  if(!url || !key || url.includes("PASTE_YOUR") || key.includes("PASTE_YOUR")){ configProblem="Add your Supabase URL and key to config.js."; return; }
  try{ sb = supabase.createClient(url, key, { auth: { storage: authStorage, persistSession: true, autoRefreshToken: true } }); }catch(e){ configProblem = "Could not connect: "+e.message; }
})();

const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const initials = n => String(n||"?").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("");
const ago = d => { const m=(Date.now()-new Date(d))/60000;
  if(m<1) return "just now"; if(m<60) return Math.round(m)+" min ago";
  if(m<1440) return Math.round(m/60)+"h ago"; return Math.round(m/1440)+"d ago"; };

/* ---------- app state ---------- */
const S = {
  me:null, courses:[], lessons:[], enrolled:[], attempts:[], portfolio:[],
  students:[], viewing:null, course:null, lesson:null, gSubject:null, gTopic:null, busy:{}, cache:{}, chat:[]
};

/* ---------- the genome, computed from real evidence ---------- */
const WEIGHTS = { test:30, paper:22, examlens:18, mirage:18, quiz:14, doctor:10, lesson:6 };
const HALF_LIFE_DAYS = 60;
function genomeFrom(attempts){
  const now=Date.now(), map={};
  attempts.forEach(a=>{
    const w = WEIGHTS[a.kind] ?? 10;
    const decay = Math.pow(0.5, ((now-new Date(a.created_at))/86400000)/HALF_LIFE_DAYS);
    const t = map[a.topic] ||= {topic:a.topic, subject:a.subject||"", num:0, den:0, n:0, last:a.created_at};
    t.num += Number(a.score)*w*decay; t.den += w*decay; t.n++;
    if(new Date(a.created_at) > new Date(t.last)) t.last = a.created_at;
  });
  const topics = Object.values(map).map(t=>({
    topic:t.topic, subject:t.subject, evidence:t.n, last:t.last,
    score: Math.round(t.num/t.den),
    confidence: Math.min(100, Math.round(t.den/60*100))
  })).sort((a,b)=>a.score-b.score);
  const overall = topics.length ? Math.round(topics.reduce((s,t)=>s+t.score,0)/topics.length) : null;
  return { topics, overall, weakest: topics[0]||null, strongest: topics[topics.length-1]||null };
}
const G = () => genomeFrom(S.attempts);

/* One weighted score for any bundle of attempts. */
function scoreOf(atts){
  const now = Date.now(); let num=0, den=0, last=0;
  atts.forEach(a=>{
    const w = WEIGHTS[a.kind] ?? 10;
    const decay = Math.pow(0.5, ((now-new Date(a.created_at))/86400000)/HALF_LIFE_DAYS);
    num += Number(a.score)*w*decay; den += w*decay;
    last = Math.max(last, new Date(a.created_at).getTime());
  });
  return { score: den ? Math.round(num/den) : null, evidence: atts.length,
           confidence: Math.min(100, Math.round(den/60*100)), last };
}
/* Group attempts into the nodes one ring of the genome shows. */
function nodesBy(atts, keyFn){
  const map = {};
  atts.forEach(a=>{ const k = keyFn(a) || "Unsorted"; (map[k] ||= []).push(a); });
  return Object.entries(map).map(([name, rows])=>({ name, ...scoreOf(rows) }))
    .sort((a,b)=>a.score-b.score);
}
const lessonName = id => { const l = S.lessons.find(x=>x.id===id); return l ? l.title : null; };

/* ---------- talking to the AI service ---------- */
async function ai(task, payload){
  const { data:{ session } } = await sb.auth.getSession();
  let res;
  try{
    res = await fetch(`${CFG.SUPABASE_URL.replace(/\/+$/,"")}/functions/v1/ai`, {
      method:"POST",
      headers:{ "Content-Type":"application/json", apikey:CFG.SUPABASE_ANON_KEY,
                Authorization:`Bearer ${session.access_token}` },
      body: JSON.stringify({ task, payload })
    });
  }catch(e){
    throw new Error("The AI service isn't reachable. Deploy the 'ai' function (part 2 of SETUP.md), then try again.");
  }
  if(res.status===404) throw new Error("No AI function found on this project. Run: supabase functions deploy ai");
  let out;
  try{ out = await res.json(); }
  catch(e){ throw new Error(`AI service returned ${res.status} with no JSON. Check Edge Functions → Logs.`); }
  if(out.error){
    if(String(out.error).includes("GROQ_API_KEY"))
      throw new Error("The function is deployed but has no Groq key. Run: supabase secrets set GROQ_API_KEY=your_key");
    throw new Error(out.error);
  }
  return out;
}

/* Shrink a photo before it goes over the wire — phone camera photos are often
   4-8MB, and Groq's vision model only reads up to 20MB and pays per-image in
   fixed tokens regardless of resolution, so there's nothing gained by full size. */
function fileToCompressedDataURL(file, maxDim = 1600, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width: w, height: h } = img;
        if (w > maxDim || h > maxDim) {
          const scale = maxDim / Math.max(w, h);
          w = Math.round(w * scale); h = Math.round(h * scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = () => reject(new Error("Could not read that photo"));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error("Could not read that photo"));
    reader.readAsDataURL(file);
  });
}

/* ---------- writing evidence ---------- */
/* Full-screen "rank up" reveal for a single badge. Resolves once it's dismissed
   (tap, or an auto-timeout), so callers can show several one after another. */
function celebrateBadge(b){
  return new Promise(resolve=>{
    const t = TIERS[b.tier] || TIERS.common;
    const el = document.createElement("div");
    el.className = "badge-fx";
    el.style.setProperty("--bfx-a", t.a);
    el.style.setProperty("--bfx-glow", t.a + "99");
    el.innerHTML = `
      <div class="badge-fx-burst"></div>
      <div class="badge-fx-rings"><div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div></div>
      <div class="badge-fx-emblem">${emblem(b, 168)}</div>
      <div class="badge-fx-eyebrow">Badge unlocked</div>
      <h2 class="badge-fx-name">${esc(b.name)}${b.sub ? " · " + esc(b.sub) : ""}</h2>
      <div class="badge-fx-tier">${t.label}</div>
      <p class="badge-fx-desc">${esc(b.desc)}</p>
      <div class="badge-fx-tap">Equip it from your profile · tap to continue</div>`;
    document.body.appendChild(el);
    let done = false;
    const finish = () => {
      if(done) return; done = true;
      el.classList.remove("show");
      setTimeout(() => { el.remove(); resolve(); }, 300);
    };
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("show")));
    el.addEventListener("click", finish);
    setTimeout(finish, 3600);
  });
}
async function announceUnlocks(before){
  const all = badgesFor(myBadgeCtx());
  const fresh = all.filter(b => b.earned && !before.includes(b.id));
  for(const b of fresh) await celebrateBadge(b);
}
async function record({kind, subject, topic, score, seconds, lesson_id, meta}){
  const before = S.me.role==="student" ? badgesFor(myBadgeCtx()).filter(b=>b.earned).map(b=>b.id) : [];
  const row = { student_id:S.me.id, kind, subject:subject||null, topic, score,
                seconds:seconds||null, lesson_id:lesson_id||null, meta:meta||{} };
  const { data, error } = await sb.from("attempts").insert(row).select().single();
  if(error) { toast("Could not save: "+error.message); return null; }
  S.attempts.unshift(data);
  if(S.me.role==="student") announceUnlocks(before);
  return data;
}

/* ---------- small ui helpers ---------- */
const icon = p=>`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I = {
  home:icon('<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>'),
  learn:icon('<path d="M4 4h7v16H4z"/><path d="M13 4h7v16h-7z"/>'),
  growth:icon('<circle cx="12" cy="12" r="8"/><path d="M12 8v8M8 12h8"/>'),
  school:icon('<path d="M3 9l9-5 9 5-9 5z"/><path d="M7 11v5c0 1 2.5 2 5 2s5-1 5-2v-5"/>'),
  lens:icon('<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>'),
  doctor:icon('<path d="M12 4v16M4 12h16"/>'),
  folder:icon('<path d="M3 7h6l2 2h10v10H3z"/>'),
  ai:icon('<path d="M12 3v18M5 8l14 8M19 8L5 16"/>'),
  user:icon('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6"/>'),
  more:icon('<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>'),
  settings:icon('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
  mirage:icon('<path d="M4 18c3-8 13-8 16 0"/><circle cx="12" cy="8" r="2"/>')
};
function toast(msg){
  const t=document.createElement("div");
  t.style.cssText="position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:80;background:var(--teal);color:var(--on-accent);font-weight:700;font-size:12.5px;padding:10px 16px;border-radius:99px;max-width:86vw;text-align:center";
  t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600);
}
const barRow = (label,v,weak,sub)=>`
  <div style="padding:9px 0">
    <div class="between" style="margin-bottom:6px">
      <div><div style="font-size:var(--fs-2);font-weight:600">${esc(label)}</div>${sub?`<div class="note">${esc(sub)}</div>`:""}</div>
      <div class="pct ${weak?"warn":""}">${v===null||v===undefined?"—":v+"%"}</div></div>
    <div class="bar ${weak?"warn":""}"><i style="width:${v||0}%"></i></div></div>`;
/* Radar web. Nodes are clickable when there's a level below them. */
function web(items, drillTo){
  const n = items.length;
  if(n < 3) return `<div class="card flat"><div class="note">A web needs at least three points to be worth drawing.
    ${n===0?"Nothing here yet.":"There "+(n===1?"is one":"are two")+" here, shown below instead."}</div></div>`;
  /* Wider canvas, labels anchored away from the centre and wrapped onto two lines,
     so long topic names don't run off the edge of a phone screen. */
  const W=420, cx=210, cy=168, R=90;
  const pt=(i,r)=>[cx+r*Math.cos(-Math.PI/2+i*2*Math.PI/n), cy+r*Math.sin(-Math.PI/2+i*2*Math.PI/n)];
  const wrap = name => {
    const words = name.split(/\s+/), lines = [""];
    words.forEach(w=>{ const cur = lines[lines.length-1];
      if((cur+" "+w).trim().length <= 13 || !cur) lines[lines.length-1] = (cur+" "+w).trim(); else lines.push(w); });
    if(lines.length > 2){ lines.length = 2; lines[1] = lines[1].slice(0,11)+"…"; }
    return lines.map(l=> l.length>14 ? l.slice(0,13)+"…" : l);
  };
  const rings=[25,50,75,100].map(p=>`<polygon points="${items.map((_,i)=>pt(i,R*p/100).join(",")).join(" ")}"
      fill="none" stroke="var(--line)"/>`).join("");
  const spokes=items.map((_,i)=>{const [x,y]=pt(i,R);
    return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`}).join("");
  const shape=items.map((t,i)=>pt(i,R*(t.score||0)/100).join(",")).join(" ");
  const parts=items.map((t,i)=>{
    const [dx,dy]=pt(i,R*(t.score||0)/100);
    const [lx,ly]=pt(i,R+14);
    const side = lx - cx;
    const anchor = Math.abs(side) < 12 ? "middle" : side > 0 ? "start" : "end";
    const lines = wrap(t.name);
    const top = ly < cy - R*0.6 ? ly - 15*lines.length : ly > cy + R*0.6 ? ly + 12 : ly - 7*(lines.length-1);
    const weak = t.score!==null && t.score<60;
    const click = drillTo ? `data-act="drill" data-to="${drillTo(t)}" style="cursor:pointer"` : "";
    return `<g ${click}>
      <circle cx="${dx}" cy="${dy}" r="4.5" fill="${weak?"var(--warn)":"var(--teal)"}"/>
      <circle cx="${lx}" cy="${ly}" r="30" fill="transparent"/>
      <text text-anchor="${anchor}" font-size="13.5" fill="${weak?"var(--warn)":"var(--ink-2)"}">
        ${lines.map((l,k)=>`<tspan x="${lx}" y="${top+k*15}">${esc(l)}</tspan>`).join("")}
        <tspan x="${lx}" y="${top+lines.length*15+1}" font-weight="700" fill="${weak?"var(--warn)":"var(--teal)"}">${t.score===null?"—":t.score+"%"}</tspan>
      </text></g>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} 345" role="img" aria-label="Genome web" style="width:100%;max-width:460px">
    ${rings}${spokes}
    <polygon points="${shape}" fill="rgba(var(--accent-rgb),.15)" stroke="var(--teal)" stroke-width="1.6"/>
    ${parts}
    <text x="${cx}" y="340" font-size="9.5" text-anchor="middle" fill="var(--mute)">Rings mark 25, 50, 75 and 100 percent</text>
  </svg>`;
}

function videoEmbed(url){
  const m = String(url).match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/)([A-Za-z0-9_-]{11})/);
  if(m) return `<div style="aspect-ratio:16/9"><iframe src="https://www.youtube-nocookie.com/embed/${m[1]}"
    style="width:100%;height:100%;border:0" allowfullscreen title="Lesson video"></iframe></div>`;
  return `<video controls src="${esc(url)}" style="width:100%;display:block"></video>`;
}

V.genome = () => {
  const sub = S.gSubject, top = S.gTopic;
  const all = S.attempts;
  if(!all.length) return `
    <div class="topbar"><div><h1 class="h1">Learning genome</h1>
      <div class="sub">Built from your own graded work</div></div>
      <a class="btn ghost sm" href="#/weights">How is this scored?</a></div>
    ${empty("Nothing to model yet",
      "The genome needs evidence before it can say anything true about you. A lesson checkpoint, an ExamLens analysis or a Mirage run will start it off.",
      `<a class="btn" href="#/learn">Go to Learn</a>`)}`;

  const enc = encodeURIComponent;
  let level, items, atts, crumb, title, caption, drillTo;

  if(!sub){
    level = "subject"; atts = all;
    items = nodesBy(atts, a=>a.subject);
    title = "Learning genome";
    caption = "Each strand is a subject. Click one to open its topics.";
    crumb = "";
    drillTo = t => `#/genome/${enc(t.name)}`;
  } else if(!top){
    level = "topic"; atts = all.filter(a=>(a.subject||"Unsorted")===sub);
    items = nodesBy(atts, a=>a.topic);
    title = sub;
    caption = "Each strand is a topic in this subject. Click one to open its lessons.";
    crumb = `<div class="crumb"><a href="#/genome">Genome</a> · ${esc(sub)}</div>`;
    drillTo = t => `#/genome/${enc(sub)}/${enc(t.name)}`;
  } else {
    level = "lesson"; atts = all.filter(a=>(a.subject||"Unsorted")===sub && a.topic===top);
    items = nodesBy(atts, a=> a.lesson_id ? (lessonName(a.lesson_id) || "Lesson") : ({
      examlens:"ExamLens analysis", mirage:"Mirage run", paper:"Past paper", test:"Test", quiz:"Quiz"
    }[a.kind] || a.kind));
    title = top;
    caption = "Each strand is one lesson or assessment inside this topic. This is the bottom of the genome.";
    crumb = `<div class="crumb"><a href="#/genome">Genome</a> · <a href="#/genome/${enc(sub)}">${esc(sub)}</a> · ${esc(top)}</div>`;
    drillTo = null;
  }

  const here = scoreOf(atts);
  const weakest = items.filter(i=>i.score!==null)[0];

  return `
  ${crumb}
  <div class="topbar">
    <div><h1 class="h1" style="font-size:${level==="subject"?"var(--fs-7)":"var(--fs-6)"}">${esc(title)}</h1>
      <div class="sub">${caption}</div></div>
    <div class="row" style="gap:8px">
      ${sub?`<a class="btn ghost sm" href="${top?`#/genome/${enc(sub)}`:"#/genome"}">Back</a>`:""}
      <a class="btn ghost sm" href="#/weights">How is this scored?</a></div>
  </div>

  <div class="grid g3">
    <div class="stat"><div class="k">${level==="subject"?"Across everything":level==="topic"?"Subject score":"Topic score"}</div>
      <div class="v">${here.score===null?"—":here.score+"%"}</div>
      <div class="note">${here.evidence} attempt${here.evidence===1?"":"s"}</div></div>
    <div class="stat ${weakest && weakest.score<60?"warn":""}"><div class="k">Weakest strand</div>
      <div class="v" style="font-size:var(--fs-4)">${weakest?esc(weakest.name):"—"}</div>
      <div class="note">${weakest?weakest.score+"%":"nothing yet"}</div></div>
    <div class="stat"><div class="k">Confidence</div><div class="v">${here.confidence}%</div>
      <div class="note">how much evidence is behind this</div></div>
  </div>

  <div class="card" style="margin-top:14px;display:grid;place-items:center">
    ${web(items, drillTo)}
  </div>

  <div class="sec">${level==="subject"?"Subjects":level==="topic"?"Topics":"Lessons and assessments"}</div>
  <div class="card">
    ${items.map(t=>{
      const row = barRow(t.name, t.score, t.score!==null && t.score<60,
        `${t.evidence} attempt${t.evidence===1?"":"s"} · last ${ago(new Date(t.last))}`);
      return drillTo
        ? `<div data-act="drill" data-to="${drillTo(t)}" style="cursor:pointer">${row}</div>`
        : row;
    }).join("")}
  </div>
  ${drillTo?`<div class="note" style="margin-top:10px">Click any strand to go a level deeper.</div>`:
    `<div class="note" style="margin-top:10px">Nothing sits below a lesson. If a strand here is weak, that's the thing to redo.</div>`}

};

/* Score ring used by ExamLens reports. */
function ring(v, size=92){
  const r = 38, c = 2*Math.PI*r, weak = v < 60;
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 92 92" role="img" aria-label="${v} percent">
    <circle cx="46" cy="46" r="${r}" fill="none" stroke="var(--line)" stroke-width="8"/>
    <circle cx="46" cy="46" r="${r}" fill="none" stroke="${weak?"var(--warn)":"var(--teal)"}" stroke-width="8" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.max(0,Math.min(100,v))/100)}" transform="rotate(-90 46 46)"/>
    <text x="46" y="52" text-anchor="middle" font-size="21" font-weight="800" fill="${weak?"var(--warn)":"var(--ink)"}">${v}%</text>
  </svg>`;
}

function renderChat(){
  const c = $("#chat"); if(!c) return;
  if(!S.chat.length){
    c.innerHTML = `<div class="card empty"><b>Ask me anything about your work</b>
      <p class="note">I read your genome, your attempts and your goal. If there's no evidence for something, I'll tell you that instead of guessing.</p></div>`;
    return;
  }
  c.innerHTML = S.chat.map(m=>{
    if(m.role==="user") return `<div class="msg me">${esc(m.content)}</div>`;
    if(m.role==="typing") return `<div class="msg ai typing"><i></i><i></i><i></i></div>`;
    return `<div class="msg ai fade"><div class="prose" style="font-size:var(--fs-2)">${esc(m.content)}</div>
      ${m.topics&&m.topics.length?`<div class="sources">${m.topics.map(t=>`<span class="chip teal">${esc(t.topic)} ${t.score}%</span>`).join("")}</div>`:""}
      </div>`;
  }).join("");
  c.lastElementChild && c.lastElementChild.scrollIntoView({block:"end"});
}
async function send(text){
  if(!text || !text.trim()) return;
  S.chat.push({role:"user", content:text}); S.chat.push({role:"typing"}); renderChat();
  try{
    const history = S.chat.filter(m=>m.role==="user"||m.role==="assistant").slice(-6)
      .map(m=>({role:m.role, content:m.content}));
    const out = await ai("chat",{ message:text, history: history.slice(0,-1) });
    S.chat.pop(); S.chat.push({role:"assistant", content:out.reply, topics:out.topics});
    /* Saved so it survives logging out and back in — failures here are silent,
       the conversation still works this session even if a save drops. */
    sb.from("chat_messages").insert([
      { student_id:S.me.id, role:"user", content:text },
      { student_id:S.me.id, role:"assistant", content:out.reply },
    ]).then(({error})=>{ if(error) console.warn("Could not save chat message:", error.message); });
  }catch(e){
    S.chat.pop(); S.chat.push({role:"assistant", content:"I couldn't reach the AI service. "+e.message});
  }
  renderChat();
}

function rng(seed){ return ()=> (seed = (seed*16807) % 2147483647) / 2147483647; }
const SVG = (defs, body) => `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1600 400' preserveAspectRatio='xMidYMid slice'><defs>${defs}</defs>${body}</svg>`;
const scene = s => `${svgURI(s)} center/cover no-repeat`;

  /* Magma: cooled rock split by glowing seams, with embers rising */

    for(let i=0;i<34;i++){ let x=r()*1600, y=r()*400, d=`M${x|0} ${y|0}`;
      const a0 = r()*Math.PI*2; for(let k=0;k<7;k++){ const a=a0+(r()-.5)*1.4; x+=Math.cos(a)*(30+r()*60); y+=Math.sin(a)*(20+r()*40); d+=` L${x|0} ${y|0}`; }
      cracks += `<path d='${d}' stroke-width='${(2+r()*5).toFixed(1)}'/>`; }

    return SVG(`<radialGradient id='b' cx='.35' cy='.55' r='.8'><stop offset='0' stop-color='#6b1a06'/><stop offset='.6' stop-color='#2b0a04'/><stop offset='1' stop-color='#120402'/></radialGradient>
      <filter id='glow' x='-20%' y='-20%' width='140%' height='140%'><feGaussianBlur stdDeviation='7' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter>
      <radialGradient id='hot' cx='.3' cy='.5' r='.5'><stop offset='0' stop-color='#ff8a1f' stop-opacity='.55'/><stop offset='1' stop-color='#ff8a1f' stop-opacity='0'/></radialGradient>`,
      `<rect width='1600' height='400' fill='url(#b)'/><rect width='1600' height='400' fill='url(#hot)'/>
       <g fill='none' stroke='#ff9d2e' stroke-linecap='round' stroke-linejoin='round' filter='url(#glow)'>${cracks}</g>${embers}`);

  autumn: (()=>{ const r = rng(37);

    const leafPath = "M0 -16 C7 -9 14 -8 16 0 C9 3 7 9 0 16 C-7 9 -9 3 -16 0 C-14 -8 -7 -9 0 -16Z";

         <path d='M-33 -36 L6 -20 L-33 -4Z' fill='#c22f26'/><path d='M4 -72 L22 -78 L4 -84Z' fill='#ffd24a'/></g>`);

  /* Misty pines: layered forest fading into fog under a pale moon */
  pines: (()=>{ const r = rng(67);
    const tree=(x,y,h,w)=>`M${x} ${y-h} L${x+w*.26} ${y-h*.64} L${x+w*.12} ${y-h*.64} L${x+w*.4} ${y-h*.32} L${x+w*.2} ${y-h*.32} L${x+w*.5} ${y} L${x-w*.5} ${y} L${x-w*.2} ${y-h*.32} L${x-w*.4} ${y-h*.32} L${x-w*.12} ${y-h*.64} L${x-w*.26} ${y-h*.64}Z`;
    const layers = [["#a9c3d3",250,90,.9],["#7f9fb6",300,130,.95],["#4f7390",345,170,1],["#1f3d57",400,230,1]];
    let body = "";
    layers.forEach(([c,base,h,op],li)=>{ let d=""; let x=-40;
      while(x<1650){ const hh=h*(.7+r()*.6), ww=hh*(.42+r()*.12); d+=tree(x|0,base+(r()*14|0),hh|0,ww|0); x+=ww*(.45+r()*.5); }

      `<rect width='1600' height='400' fill='url(#s)'/><circle cx='1150' cy='250' r='90' fill='#ffe3a6'/>

       <path d='M0 330 C260 290 560 350 900 310 C1200 280 1400 330 1600 300 L1600 400 L0 400Z' fill='#b8663a'/>

  /* Constellation: deep night with linked stars */
  constellation: (()=>{ const r = rng(97);
    const stars = Array.from({length:150},()=>`<circle cx='${(r()*1600)|0}' cy='${(r()*400)|0}' r='${(.5+r()*1.8).toFixed(1)}' fill='#fff' opacity='${(.3+r()*.7).toFixed(2)}'/>`).join("");
    const group = (pts)=>`<polyline points='${pts.map(p=>p.join(",")).join(" ")}' fill='none' stroke='#7fe8ff' stroke-opacity='.45' stroke-width='1.6'/>${pts.map(([x,y])=>`<circle cx='${x}' cy='${y}' r='4' fill='#e8fbff'/><circle cx='${x}' cy='${y}' r='11' fill='#7fe8ff' opacity='.18'/>`).join("")}`;

  neon: (()=>{ let grid = "";

      `<rect width='1600' height='400' fill='url(#s)'/><circle cx='800' cy='250' r='130' fill='url(#sun)' mask='url(#cut)'/>

  /* Aurora borealis: the legendary one. Flowing curtains of light over a starry sky */
  borealis: (()=>{ const r = rng(131);

         <path d='M-50 120 C220 40 420 180 700 90 C950 10 1150 150 1650 40' stroke='url(#a2)' stroke-width='80' opacity='.55'/>

/* Requirement helpers: a banner can ask for badge counts or specific badges. */
const has = (list, id) => list.some(b=>b.earned && (b.id===id || (id==="strong:*" && b.id.startsWith("strong:"))));
const count = list => list.filter(b=>b.earned).length;
const strongCount = list => list.filter(b=>b.earned && b.id.startsWith("strong:") && b.id!=="strong:?").length;
const needBadges = n => ({ text:`Earn ${n} badges`, check:l=>count(l)>=n, prog:l=>`${Math.min(count(l),n)}/${n}` });
const needBadge = (id, name) => ({ text:`Unlock ${name}`, check:l=>has(l,id), prog:l=>has(l,id)?"Done":"Not yet" });

/* ---- the facts badges are judged on ---- */
function streakOf(days){
  const set = new Set(days); let best = 0, run = 0;
  const sorted = [...set].sort();
  let prev = null;
  sorted.forEach(d=>{
    const t = new Date(d+"T00:00:00").getTime();
    run = (prev!==null && t - prev === 86400000) ? run+1 : 1;
    best = Math.max(best, run); prev = t;
  });
  return { best, days: set.size };
}
/* Every badge, earned or not, with progress towards it. */
function badgesFor(ctx){
  const { attempts=[], loginDays=[], portfolioCount=0, enrolledCount=0 } = ctx;
  const st = streakOf(loginDays);
  const lessonsPassed = attempts.filter(a=>a.kind==="lesson" && Number(a.score)>=100).length;
  const lens = attempts.filter(a=>a.kind==="examlens").length;
  const realDeal = attempts.some(a=>a.kind==="mirage" && a.meta && Number(a.meta.genuine)>=80
                                  && (Number(a.meta.apparent)-Number(a.meta.genuine))<=10);
  const comeback = (()=>{
    const byTopic = {};
    [...attempts].sort((x,y)=>new Date(x.created_at)-new Date(y.created_at)).forEach(a=>{
      (byTopic[a.topic] ||= []).push(Number(a.score));
    });
    return Object.values(byTopic).some(sc=>sc.some((v,i)=>sc.slice(i+1).some(w=>w>=v+30)));
  })();
  const n = (have, need) => ({ earned: have>=need, progress: Math.min(1, have/need), progressText: `${Math.min(have,need)} / ${need}` });
  const flag = ok => ({ earned:ok, progress:ok?1:0, progressText:ok?"Done":"Not yet" });
  const hours = attempts.map(a=>new Date(a.created_at).getHours());
  const perfect = attempts.filter(a=>Number(a.score)>=100).length;
  const mirageRuns = attempts.filter(a=>a.kind==="mirage").length;
  const cleanSheet = attempts.some(a=>a.kind==="examlens" && Number(a.score)>=100);
  const subjectsTouched = new Set(attempts.map(a=>a.subject).filter(Boolean)).size;
  const busiestDay = (()=>{ const c={}; attempts.forEach(a=>{ const d=new Date(a.created_at).toDateString(); c[d]=(c[d]||0)+1; });
    return Math.max(0, ...Object.values(c)); })();
  const list = [
    { id:"login1",   name:"First Day",           tier:"common",    icon:"sun",   desc:"Sign in for the first time",           ...n(st.days,1) },
    { id:"enrolled", name:"Enrolled",            tier:"common",    icon:"book",  desc:"Join a course",                        ...n(enrolledCount,1) },
    { id:"first",    name:"First Steps",         tier:"common",    icon:"step",  desc:"Complete your first graded piece of work", ...n(attempts.length,1) },
    { id:"builder",  name:"Portfolio Builder",   tier:"common",    icon:"folder",desc:"Add 3 items to your portfolio",        ...n(portfolioCount,3) },
    { id:"login7",   name:"Regular",             tier:"rare",      icon:"cal",   desc:"Sign in on 7 different days",          ...n(st.days,7) },
    { id:"streak5",  name:"On a Roll",           tier:"rare",      icon:"flame", desc:"Sign in 5 days in a row",              ...n(st.best,5) },
    { id:"cp10",     name:"Checkpoint Champion", tier:"rare",      icon:"check", desc:"Pass 10 lesson checkpoints",           ...n(lessonsPassed,10) },
    { id:"lens5",    name:"Lens Wielder",        tier:"rare",      icon:"lens",  desc:"Analyse 5 answers with ExamLens",      ...n(lens,5) },
    { id:"login30",  name:"Devoted",             tier:"epic",      icon:"crown", desc:"Sign in on 30 different days",         ...n(st.days,30) },
    { id:"comeback", name:"Comeback",            tier:"epic",      icon:"up",    desc:"Beat an earlier score on a topic by 30 points",
      earned:comeback, progress:comeback?1:0, progressText:comeback?"Done":"Not yet" },
    { id:"realdeal", name:"The Real Deal",       tier:"legendary", icon:"gem",   desc:"Mirage: 80%+ genuine mastery with almost no gap",
      earned:realDeal, progress:realDeal?1:0, progressText:realDeal?"Done":"Not yet" },
    { id:"explorer", name:"Explorer",      tier:"common", icon:"compass",  desc:"Join 3 courses",                         ...n(enrolledCount,3) },
    { id:"early",    name:"Early Bird",    tier:"rare",   icon:"sunrise",  desc:"Complete work before 7 in the morning",  ...flag(hours.some(h=>h>=4 && h<7)) },
    { id:"night",    name:"Night Owl",     tier:"rare",   icon:"moon",     desc:"Complete work after 10 at night",        ...flag(hours.some(h=>h>=22 || h<4)) },
    { id:"scholar",  name:"Scholar",       tier:"rare",   icon:"stack",    desc:"Record 25 pieces of graded work",        ...n(attempts.length,25) },
    { id:"perfect",  name:"Perfectionist", tier:"rare",   icon:"star",     desc:"Score 100% five times",                  ...n(perfect,5) },
    { id:"deep",     name:"Deep Diver",    tier:"rare",   icon:"target",   desc:"Complete 3 Mirage runs",                 ...n(mirageRuns,3) },
    { id:"curator",  name:"Curator",       tier:"rare",   icon:"folder",   desc:"Keep 6 items in your portfolio",         ...n(portfolioCount,6) },
    { id:"streak14", name:"Unstoppable",   tier:"epic",   icon:"bolt",     desc:"Sign in 14 days in a row",               ...n(st.best,14) },
    { id:"polymath", name:"Polymath",      tier:"epic",   icon:"compass",  desc:"Have graded work in 3 different subjects", ...n(subjectsTouched,3) },
    { id:"marathon", name:"Marathon",      tier:"epic",   icon:"mountain", desc:"Complete 10 pieces of work in one day",  ...n(busiestDay,10) },
    { id:"clean",    name:"Clean Sheet",   tier:"epic",   icon:"check",    desc:"Score 100% on an ExamLens analysis",     ...flag(cleanSheet) },
    { id:"centurion",name:"Centurion",     tier:"legendary", icon:"trophy",desc:"Record 100 pieces of graded work",       ...n(attempts.length,100) }
  ];
  /* Strong Genome: one badge per subject scored 80% or more, on at least 3 attempts. */
  const subjects = {};
  attempts.forEach(a=>{ (subjects[a.subject||"Unsorted"] ||= []).push(a); });
  let best = null;
  Object.entries(subjects).forEach(([sub, rows])=>{
    const sc = scoreOf(rows).score;
    const ok = sc>=80 && rows.length>=3;
    if(ok) list.push({ id:"strong:"+sub, name:"Strong Genome", sub, tier:"legendary", icon:"brain",
      desc:`${sub} genome at 80% or above`, earned:true, progress:1, progressText:`${sc}%` });
    else if(!best || sc>best.sc) best = { sub, sc, n:rows.length };
  });
  const strongN = list.filter(b=>b.id.startsWith("strong:")).length;
  list.push({ id:"dual", name:"Dual Mastery", tier:"legendary", icon:"twin",
    desc:"Strong Genome in two different subjects", ...n(strongN,2) });
  if(!list.some(b=>b.id.startsWith("strong:")))
    list.push({ id:"strong:?", name:"Strong Genome", tier:"legendary", icon:"brain",
      desc:"Reach 80% or more on a subject, over at least 3 attempts", earned:false,
      progress: best ? Math.min(1,(best.sc||0)/80) : 0,
      progressText: best ? `Best: ${best.sub} ${best.sc}%` : "No subjects yet" });
  if(ctx.unlockAll){
    /* Granted by an admin in the database: everything counts as earned. */
    const real = list.filter(b=>b.id!=="strong:?");
    real.forEach(b=>{ b.earned = true; b.progress = 1; if(!/\d/.test(b.progressText||"")) b.progressText = "Granted"; });
    real.__all = true;
    return real;
  }
  return list;
}

function avatarHtml(p, size=38){
  const st = `width:${size}px;height:${size}px;font-size:${Math.round(size*0.36)}px`;
  return p && p.avatar_url
    ? `<img class="avatar" src="${esc(p.avatar_url)}" alt="" style="${st};object-fit:cover;padding:0">`
    : `<div class="avatar" style="${st}">${esc(initials(p?p.full_name:"?"))}</div>`;
}
/* The player banner. Only badges the person has actually earned are drawn. */
function playerBanner(p, ctx, opts={}){
  const all = p.role==="student" ? badgesFor(ctx) : [];
  const earned = new Set(all.filter(b=>b.earned).map(b=>b.id));
  const shown = (p.badges_shown||[]).filter(id=>earned.has(id)).slice(0,3)
    .map(id=>all.find(b=>b.id===id));
  const g = p.role==="student" ? scoreOf(ctx.attempts||[]) : null;
  const slots = [0,1,2].map(i=>{
    const b = shown[i];
    return b ? `<div class="pb-slot" title="${esc(b.name)}${b.sub?" · "+esc(b.sub):""} — ${esc(b.desc)}">
        ${emblem(b, opts.small?34:44)}<span>${esc(b.sub||b.name)}</span></div>`
      : `<div class="pb-slot empty">${opts.small?"":"<span>Empty</span>"}</div>`;
  }).join("");

/* square-crop a photo before upload */
function squareImage(file, size=320){
  return new Promise((resolve,reject)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{
      const s = Math.min(img.width, img.height), c = document.createElement("canvas");
      c.width = c.height = size;
      c.getContext("2d").drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url);
      c.toBlob(b=> b ? resolve(b) : reject(new Error("Couldn't process that image")), "image/jpeg", 0.88);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error("Couldn't open that image")); };
    img.src = url;
  });
}
async function saveProfile(patch){
  const { error } = await sb.from("profiles").update(patch).eq("id", S.me.id);

document.addEventListener("change", async e=>{
  if(e.target.id !== "avFile" || !e.target.files[0]) return;
  S.busy.avatar = true; rerender();
  try{
    const blob = await squareImage(e.target.files[0]);
    const path = `${S.me.id}/avatar-${Date.now()}.jpg`;
    const { error } = await sb.storage.from("avatars").upload(path, blob, { contentType:"image/jpeg", upsert:true });
    if(error) throw error;
    const { data } = sb.storage.from("avatars").getPublicUrl(path);
    const old = S.me.avatar_url;
    if(await saveProfile({ avatar_url: data.publicUrl })){

    toast(/bucket|not found/i.test(err.message) ? "Photo storage isn't set up yet — run profile-customization.sql" : err.message);

async function taSend(text){
  text = (text||"").trim(); if(!text || S.ta.busy) return;
  S.ta.msgs.push({ role:"user", content:text }); S.ta.busy = true; rerender();
  try{
    const out = await ai("teacher_chat", { message:text });
    S.ta.msgs.push({ role:"assistant", content:out.reply });
    if(out.memory) S.ta.memory = out.memory;
    if(out.remembered && out.remembered.length) toast(`Remembered: ${out.remembered[0]}${out.remembered.length>1?` (+${out.remembered.length-1})`:""}`);
  }catch(e){ S.ta.msgs.push({ role:"assistant", content:"I couldn't reach the AI service. "+e.message }); }
  S.ta.busy = false; rerender();
  const c = $("#taChat"); c && c.lastElementChild && c.lastElementChild.scrollIntoView({block:"end"});
}

const PREFS_KEY = "edunexus-prefs";
const PREF_DEFAULTS = { theme:"dark", accent:"teal", size:"normal", motion:"full" };
function getPrefs(){
  try{ return { ...PREF_DEFAULTS, ...JSON.parse(localStorage.getItem(PREFS_KEY) || "{}") }; }
  catch(e){ return { ...PREF_DEFAULTS }; }
}
function applyPrefs(p){
  const r = document.documentElement;
  let t = p.theme;
  if(t === "system") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  r.dataset.theme = t; r.dataset.accent = p.accent; r.dataset.size = p.size; r.dataset.motion = p.motion;
}
function setPref(key, value){
  const p = { ...getPrefs(), [key]: value };
  try{ localStorage.setItem(PREFS_KEY, JSON.stringify(p)); }catch(e){}
  applyPrefs(p); rerender();
}

function buildNav(){
  const rs = routesFor(S.me.role), here = (location.hash.split("/")[1]||"");
  const on = h => h.split("/")[1]===here ? "on":"";
  $("#nav").innerHTML = rs.filter(r=>r.g==="main").map(r=>`<a class="${on(r.h)}" href="${r.h}">${I[r.i]}${r.t}</a>`).join("")
    + (rs.some(r=>r.g==="quick")?`<div class="nav-label">Quick access</div>`:"")
    + rs.filter(r=>r.g==="quick").map(r=>`<a class="${on(r.h)}" href="${r.h}">${I[r.i]}${r.t}</a>`).join("")
    + `<div class="nav-sep" role="separator"></div>`
    + `<a class="${on("#/settings")}" href="#/settings">${I.settings}Settings</a>`;
  /* A phone only fits four tabs comfortably. Everything else lives behind More,
     so no screen is unreachable on mobile. */
  const tabs = rs.filter(r=>r.g==="main").slice(0,4);
  const rest = rs.filter(r=>!tabs.includes(r));
  const moreOn = rest.some(r=>on(r.h)) || here==="settings";
  $("#mobilebar").innerHTML = tabs.map(r=>`<a class="${on(r.h)}" href="${r.h}">${I[r.i]}<span>${r.t}</span></a>`).join("")
    + `<a class="${moreOn?"on":""}" href="#" data-act="more" aria-haspopup="true">${I.more}<span>More</span></a>`;
  S.moreRoutes = rest;
}
