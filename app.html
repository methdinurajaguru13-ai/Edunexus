<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduNexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#040a09; --bg2:#070f0e; --panel:#0a1614; --panel2:#0d1d1a;
  --line:#153630; --line-soft:#102520;
  --teal:#2fe3c0; --teal-dim:#1c8c78; --teal-ghost:rgba(47,227,192,.10);
  --ink:#e6f6f2; --ink-2:#a9c8c1; --mute:#6f918a;
  --warn:#f08a5d; --warn-soft:rgba(240,138,93,.12); --warn-line:rgba(240,138,93,.45);
  --r:14px; --r-sm:10px;
  --fs-1:11px; --fs-2:12.5px; --fs-3:14px; --fs-4:16px; --fs-5:20px; --fs-6:26px; --fs-7:34px;
}
:root:not([data-theme="light"]){color-scheme:dark;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:var(--fs-3);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(900px 500px at 12% -10%,rgba(47,227,192,.07),transparent 60%),
    radial-gradient(700px 400px at 100% 100%,rgba(47,227,192,.05),transparent 60%);
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
a{color:inherit;text-decoration:none;}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

/* ---------- shell ---------- */
.app{position:relative;z-index:1;display:grid;grid-template-columns:232px minmax(0,1fr) 312px;min-height:100vh;}
.side{border-right:1px solid var(--line-soft);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px;}
.brand b{font-size:var(--fs-4);font-weight:800;letter-spacing:-.02em;}
.nav{display:flex;flex-direction:column;gap:2px;}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--r-sm);color:var(--ink-2);font-weight:600;font-size:var(--fs-3);}
.nav a:hover{background:var(--panel);color:var(--ink);}
.nav a.on{background:var(--teal-ghost);color:var(--teal);}
.nav-label{margin:18px 12px 6px;font-size:var(--fs-1);color:var(--mute);font-weight:600;}
.side-foot{margin-top:auto;border-top:1px solid var(--line-soft);padding-top:12px;}

.main{min-width:0;padding:26px 30px 90px;}
.aside{border-left:1px solid var(--line-soft);padding:22px 18px;position:sticky;top:0;height:100vh;overflow:auto;}

.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:22px;}
.h1{font-size:var(--fs-7);font-weight:800;letter-spacing:-.03em;margin:0;line-height:1.1;}
.h2{font-size:var(--fs-5);font-weight:700;letter-spacing:-.02em;margin:0 0 12px;}
.sub{color:var(--mute);font-size:var(--fs-2);margin-top:5px;}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);
  display:grid;place-items:center;font-weight:700;color:var(--teal);font-size:var(--fs-2);flex:none;}

/* ---------- pieces ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;}
.card.flat{background:var(--bg2);}
.grid{display:grid;gap:14px;}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g4{grid-template-columns:repeat(4,minmax(0,1fr));}
.row{display:flex;align-items:center;gap:10px;}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;}
.stat .k{font-size:var(--fs-2);color:var(--mute);}
.stat .v{font-size:var(--fs-6);font-weight:700;letter-spacing:-.02em;margin-top:2px;}
.stat.warn{border-color:var(--warn-line);background:var(--warn-soft);}
.stat.warn .v{color:var(--warn);}

.bar{height:6px;border-radius:99px;background:var(--line-soft);overflow:hidden;}
.bar i{display:block;height:100%;background:var(--teal);border-radius:99px;}
.bar.warn i{background:var(--warn);}
.pct{font-variant-numeric:tabular-nums;font-weight:700;}
.pct.warn{color:var(--warn);}

.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:99px;
  border:1px solid var(--line);background:var(--bg2);font-size:var(--fs-1);color:var(--ink-2);}
.chip.teal{border-color:rgba(47,227,192,.4);color:var(--teal);background:var(--teal-ghost);}
.chip.warn{border-color:var(--warn-line);color:var(--warn);background:var(--warn-soft);}

.tag{display:inline-flex;padding:2px 7px;border-radius:5px;font-size:var(--fs-1);font-weight:700;letter-spacing:.02em;}
.tag.gap{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-line);}
.tag.slip{background:var(--panel2);color:var(--ink-2);border:1px solid var(--line);}
.tag.pace{background:var(--panel2);color:var(--ink-2);border:1px solid var(--line);}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 15px;border-radius:var(--r-sm);
  background:var(--teal);color:#032019;font-weight:700;font-size:var(--fs-2);}
.btn:hover{filter:brightness(1.07);}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
.btn.ghost:hover{background:var(--panel2);}
.btn.sm{padding:7px 12px;font-size:var(--fs-1);}
.btn[disabled]{opacity:.55;cursor:default;filter:none;}

.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;}
.tabs button{padding:7px 13px;border-radius:99px;border:1px solid var(--line);color:var(--ink-2);font-size:var(--fs-2);font-weight:600;}
.tabs button.on{background:var(--teal);border-color:var(--teal);color:#032019;}

.list{display:flex;flex-direction:column;}
.list .item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 12px;border-radius:var(--r-sm);}
.list .item + .item{border-top:1px solid var(--line-soft);}
.item.on{background:var(--teal-ghost);}
.item.locked{color:var(--mute);}
.done{color:var(--teal);}

.ai{border:1px solid rgba(47,227,192,.32);background:linear-gradient(180deg,rgba(47,227,192,.08),rgba(47,227,192,.02));
  border-radius:var(--r);padding:14px;}
.ai .who{display:flex;align-items:center;gap:7px;color:var(--teal);font-weight:700;font-size:var(--fs-2);margin-bottom:7px;}
.ai p{margin:0 0 10px;font-size:var(--fs-2);color:var(--ink);line-height:1.55;}

.note{font-size:var(--fs-1);color:var(--mute);}
.sec{margin:26px 0 12px;font-size:var(--fs-2);color:var(--mute);font-weight:600;}
.sec:first-child{margin-top:0;}
.divider{height:1px;background:var(--line-soft);margin:14px 0;}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;font-size:var(--fs-2);}
.kv + .kv{border-top:1px solid var(--line-soft);}
.kv span:first-child{color:var(--mute);}
.crumb{font-size:var(--fs-2);color:var(--mute);margin-bottom:10px;}
.crumb a:hover{color:var(--teal);}
.warn-text{color:var(--warn);}
.teal-text{color:var(--teal);}
.mono{font-variant-numeric:tabular-nums;}

/* counsellor */
.chat{display:flex;flex-direction:column;gap:14px;}
.msg{max-width:76%;padding:12px 14px;border-radius:var(--r);font-size:var(--fs-2);line-height:1.6;}
.msg.me{align-self:flex-end;background:var(--teal);color:#032019;font-weight:600;border-bottom-right-radius:4px;}
.msg.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px;}
.msg.ai .evidence{margin:10px 0;border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;background:var(--bg2);}
.sources{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.composer{display:flex;gap:9px;margin-top:16px;}
.composer input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:12px 16px;color:var(--ink);font:inherit;font-size:var(--fs-2);}
.composer input::placeholder{color:var(--mute);}
.suggests{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;}
.suggests button{padding:7px 12px;border:1px solid var(--line);border-radius:99px;font-size:var(--fs-1);color:var(--ink-2);}
.suggests button:hover{border-color:var(--teal);color:var(--teal);}
.typing i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--teal);margin-right:3px;animation:blink 1.2s infinite;}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}

/* examlens question map */
.qmap{display:flex;gap:7px;flex-wrap:wrap;}
.q{width:52px;padding:6px 4px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--bg2);text-align:center;}
.q b{display:block;font-size:var(--fs-3);}
.q small{font-size:10px;color:var(--mute);}
.q.partial{border-color:rgba(240,138,93,.3);}
.q.loss{border-color:var(--warn-line);background:var(--warn-soft);color:var(--warn);}
.q.loss small{color:var(--warn);}
.q.on{outline:2px solid var(--teal);}
.legend{display:flex;gap:14px;font-size:var(--fs-1);color:var(--mute);margin-top:10px;flex-wrap:wrap;}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;}

/* answer compare */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.cmp .box{border-radius:var(--r-sm);padding:10px;font-size:var(--fs-2);}
.cmp .yours{background:var(--warn-soft);border:1px solid var(--warn-line);}
.cmp .right{background:var(--teal-ghost);border:1px solid rgba(47,227,192,.3);}
.cmp .lbl{font-size:var(--fs-1);color:var(--mute);margin-bottom:4px;}

/* mobile */
.mobilebar{display:none;}
@media (max-width:1180px){
  .app{grid-template-columns:200px minmax(0,1fr);}
  .aside{display:none;}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr;}
  .side{display:none;}
  .main{padding:18px 16px 96px;}
  .h1{font-size:var(--fs-6);}
  .g2,.g3,.g4{grid-template-columns:1fr;}
  .cmp{grid-template-columns:1fr;}
  .msg{max-width:92%;}
  .mobilebar{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:20;
    background:rgba(7,15,14,.96);border-top:1px solid var(--line);
    padding:9px 6px calc(9px + env(safe-area-inset-bottom));
  }
  .mobilebar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--mute);font-weight:600;}
  .mobilebar a.on{color:var(--teal);}
  .mobiletop{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
}
@media (min-width:861px){.mobiletop{display:none;}}
.scroll-x{overflow-x:auto;}
svg{max-width:100%;height:auto;}
.fade{animation:fade .18s ease-out;}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

<body>
<div id="gate" style="position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:var(--bg);color:var(--mute);font-size:13px">
  <span><span class="spin"></span>Loading your record…</span>
</div>
<div class="app" id="shell" style="visibility:hidden">
  <nav class="side">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="1.6"><path d="M12 4.2c-1-1.1-3.2-1.1-4 .3-1.7-.3-3 1-2.8 2.6-1.4.7-1.6 2.7-.4 3.7-.6 1.6.6 3.3 2.3 3.3.4 1.6 2.3 2.3 3.6 1.4.4.9 1.3 1.5 2.3 1.5"/><path d="M12 4.2c1-1.1 3.2-1.1 4 .3 1.7-.3 3 1 2.8 2.6 1.4.7 1.6 2.7.4 3.7.6 1.6-.6 3.3-2.3 3.3-.4 1.6-2.3 2.3-3.6 1.4-.4.9-1.3 1.5-2.3 1.5"/><path d="M12 4.2V19"/></svg>

    </div>

      <div class="note" id="whoami">—</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
/* ==================================================================
   EduNexus — real data app.
   Every screen reads rows this account owns. Nothing is invented.
================================================================== */
const CFG = window.EDUNEXUS_CONFIG || {};
let sb = null, configProblem = null;
(function connect(){
  const url = (CFG.SUPABASE_URL||"").trim().replace(/\/+$/,""), key = (CFG.SUPABASE_ANON_KEY||"").trim();
  if(!url || !key || url.includes("PASTE_YOUR") || key.includes("PASTE_YOUR")){ configProblem="Add your Supabase URL and key to config.js."; return; }
  try{ sb = supabase.createClient(url, key); }catch(e){ configProblem = "Could not connect: "+e.message; }
})();

const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const initials = n => String(n||"?").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("");
const ago = d => { const m=(Date.now()-new Date(d))/60000;
  if(m<1) return "just now"; if(m<60) return Math.round(m)+" min ago";
  if(m<1440) return Math.round(m/60)+"h ago"; return Math.round(m/1440)+"d ago"; };

/* ---------- app state ---------- */
const S = {
  me:null, courses:[], lessons:[], enrolled:[], attempts:[], portfolio:[],
  students:[], viewing:null, course:null, lesson:null, gSubject:null, gTopic:null, busy:{}, cache:{}, chat:[]
};

/* ---------- the genome, computed from real evidence ---------- */
const WEIGHTS = { test:30, paper:22, examlens:18, mirage:18, quiz:14, doctor:10, lesson:6 };
const HALF_LIFE_DAYS = 60;
function genomeFrom(attempts){
  const now=Date.now(), map={};
  attempts.forEach(a=>{
    const w = WEIGHTS[a.kind] ?? 10;
    const decay = Math.pow(0.5, ((now-new Date(a.created_at))/86400000)/HALF_LIFE_DAYS);
    const t = map[a.topic] ||= {topic:a.topic, subject:a.subject||"", num:0, den:0, n:0, last:a.created_at};
    t.num += Number(a.score)*w*decay; t.den += w*decay; t.n++;
    if(new Date(a.created_at) > new Date(t.last)) t.last = a.created_at;
  });
  const topics = Object.values(map).map(t=>({
    topic:t.topic, subject:t.subject, evidence:t.n, last:t.last,
    score: Math.round(t.num/t.den),
    confidence: Math.min(100, Math.round(t.den/60*100))
  })).sort((a,b)=>a.score-b.score);
  const overall = topics.length ? Math.round(topics.reduce((s,t)=>s+t.score,0)/topics.length) : null;
  return { topics, overall, weakest: topics[0]||null, strongest: topics[topics.length-1]||null };
}
const G = () => genomeFrom(S.attempts);

/* One weighted score for any bundle of attempts. */
function scoreOf(atts){
  const now = Date.now(); let num=0, den=0, last=0;
  atts.forEach(a=>{
    const w = WEIGHTS[a.kind] ?? 10;
    const decay = Math.pow(0.5, ((now-new Date(a.created_at))/86400000)/HALF_LIFE_DAYS);
    num += Number(a.score)*w*decay; den += w*decay;
    last = Math.max(last, new Date(a.created_at).getTime());
  });
  return { score: den ? Math.round(num/den) : null, evidence: atts.length,
           confidence: Math.min(100, Math.round(den/60*100)), last };
}
/* Group attempts into the nodes one ring of the genome shows. */
function nodesBy(atts, keyFn){
  const map = {};
  atts.forEach(a=>{ const k = keyFn(a) || "Unsorted"; (map[k] ||= []).push(a); });
  return Object.entries(map).map(([name, rows])=>({ name, ...scoreOf(rows) }))
    .sort((a,b)=>a.score-b.score);
}
const lessonName = id => { const l = S.lessons.find(x=>x.id===id); return l ? l.title : null; };

/* ---------- talking to the AI service ---------- */
async function ai(task, payload){
  const { data:{ session } } = await sb.auth.getSession();
  let res;
  try{
    res = await fetch(`${CFG.SUPABASE_URL.replace(/\/+$/,"")}/functions/v1/ai`, {
      method:"POST",
      headers:{ "Content-Type":"application/json", apikey:CFG.SUPABASE_ANON_KEY,
                Authorization:`Bearer ${session.access_token}` },
      body: JSON.stringify({ task, payload })
    });
  }catch(e){
    throw new Error("The AI service isn't reachable. Deploy the 'ai' function (part 2 of SETUP.md), then try again.");
  }
  if(res.status===404) throw new Error("No AI function found on this project. Run: supabase functions deploy ai");
  let out;
  try{ out = await res.json(); }
  catch(e){ throw new Error(`AI service returned ${res.status} with no JSON. Check Edge Functions → Logs.`); }
  if(out.error){
    if(String(out.error).includes("GROQ_API_KEY"))
      throw new Error("The function is deployed but has no Groq key. Run: supabase secrets set GROQ_API_KEY=your_key");
    throw new Error(out.error);
  }
  return out;
}

/* Shrink a photo before it goes over the wire — phone camera photos are often
   4-8MB, and Groq's vision model only reads up to 20MB and pays per-image in
   fixed tokens regardless of resolution, so there's nothing gained by full size. */
function fileToCompressedDataURL(file, maxDim = 1600, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width: w, height: h } = img;
        if (w > maxDim || h > maxDim) {
          const scale = maxDim / Math.max(w, h);
          w = Math.round(w * scale); h = Math.round(h * scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = () => reject(new Error("Could not read that photo"));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error("Could not read that photo"));
    reader.readAsDataURL(file);
  });
}

/* ---------- writing evidence ---------- */
async function record({kind, subject, topic, score, seconds, lesson_id, meta}){
  const row = { student_id:S.me.id, kind, subject:subject||null, topic, score,
                seconds:seconds||null, lesson_id:lesson_id||null, meta:meta||{} };
  const { data, error } = await sb.from("attempts").insert(row).select().single();
  if(error) { toast("Could not save: "+error.message); return null; }
  S.attempts.unshift(data);
  return data;
}

/* ---------- small ui helpers ---------- */
const icon = p=>`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I = {
  home:icon('<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>'),
  learn:icon('<path d="M4 4h7v16H4z"/><path d="M13 4h7v16h-7z"/>'),
  growth:icon('<circle cx="12" cy="12" r="8"/><path d="M12 8v8M8 12h8"/>'),
  school:icon('<path d="M3 9l9-5 9 5-9 5z"/><path d="M7 11v5c0 1 2.5 2 5 2s5-1 5-2v-5"/>'),
  lens:icon('<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>'),

function toast(msg){
  const t=document.createElement("div");
  t.style.cssText="position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:80;background:var(--teal);color:#032019;font-weight:700;font-size:12.5px;padding:10px 16px;border-radius:99px;max-width:86vw;text-align:center";
  t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600);
}
const barRow = (label,v,weak,sub)=>`
  <div style="padding:9px 0">
    <div class="between" style="margin-bottom:6px">
      <div><div style="font-size:var(--fs-2);font-weight:600">${esc(label)}</div>${sub?`<div class="note">${esc(sub)}</div>`:""}</div>
      <div class="pct ${weak?"warn":""}">${v===null||v===undefined?"—":v+"%"}</div></div>
    <div class="bar ${weak?"warn":""}"><i style="width:${v||0}%"></i></div></div>`;
/* Radar web. Nodes are clickable when there's a level below them. */
function web(items, drillTo){
  const n = items.length;
  if(n < 3) return `<div class="card flat"><div class="note">A web needs at least three points to be worth drawing.
    ${n===0?"Nothing here yet.":"There "+(n===1?"is one":"are two")+" here, shown below instead."}</div></div>`;
  const cx=170, cy=160, R=105;
  const pt=(i,r)=>[cx+r*Math.cos(-Math.PI/2+i*2*Math.PI/n), cy+r*Math.sin(-Math.PI/2+i*2*Math.PI/n)];
  const rings=[25,50,75,100].map(p=>`<polygon points="${items.map((_,i)=>pt(i,R*p/100).join(",")).join(" ")}"
      fill="none" stroke="var(--line)"/>`).join("");
  const spokes=items.map((_,i)=>{const [x,y]=pt(i,R);
    return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`}).join("");
  const shape=items.map((t,i)=>pt(i,R*(t.score||0)/100).join(",")).join(" ");
  const parts=items.map((t,i)=>{
    const [dx,dy]=pt(i,R*(t.score||0)/100);
    const [lx,ly]=pt(i,R+28);
    const weak = t.score!==null && t.score<60;
    const label = t.name.length>22 ? t.name.slice(0,20)+"…" : t.name;
    const click = drillTo ? `data-act="drill" data-to="${drillTo(t)}" style="cursor:pointer"` : "";
    return `<g ${click}>
      <circle cx="${dx}" cy="${dy}" r="4" fill="${weak?"var(--warn)":"var(--teal)"}"/>
      <circle cx="${lx}" cy="${ly-4}" r="26" fill="transparent"/>
      <text x="${lx}" y="${ly}" font-size="10" text-anchor="middle" fill="${weak?"var(--warn)":"var(--ink-2)"}">${esc(label)}</text>
      <text x="${lx}" y="${ly+12}" font-size="10" font-weight="700" text-anchor="middle"
        fill="${weak?"var(--warn)":"var(--teal)"}">${t.score===null?"—":t.score+"%"}</text></g>`;
  }).join("");
  return `<svg viewBox="0 0 340 330" role="img" aria-label="Genome web">
    ${rings}${spokes}
    <polygon points="${shape}" fill="rgba(47,227,192,.15)" stroke="var(--teal)" stroke-width="1.6"/>
    ${parts}
    <text x="${cx}" y="322" font-size="9" text-anchor="middle" fill="var(--mute)">Rings mark 25, 50, 75 and 100 percent</text>
  </svg>`;
}

function videoEmbed(url){
  const m = String(url).match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/)([A-Za-z0-9_-]{11})/);
  if(m) return `<div style="aspect-ratio:16/9"><iframe src="https://www.youtube-nocookie.com/embed/${m[1]}"
    style="width:100%;height:100%;border:0" allowfullscreen title="Lesson video"></iframe></div>`;
  return `<video controls src="${esc(url)}" style="width:100%;display:block"></video>`;
}

    items = nodesBy(atts, a=>a.subject);
    title = "Learning genome";

    drillTo = t => `#/genome/${enc(sub)}/${enc(t.name)}`;

    }[a.kind] || a.kind));

  <div class="topbar">

      <div class="note">${here.evidence} attempt${here.evidence===1?"":"s"}</div></div>

      <div class="note">${weakest?weakest.score+"%":"nothing yet"}</div></div>

  <div class="card">

function renderChat(){
  const c = $("#chat"); if(!c) return;
  if(!S.chat.length){
    c.innerHTML = `<div class="card empty"><b>Ask me anything about your work</b>
      <p class="note">I read your genome, your attempts and your goal. If there's no evidence for something, I'll tell you that instead of guessing.</p></div>`;
    return;
  }
  c.innerHTML = S.chat.map(m=>{
    if(m.role==="user") return `<div class="msg me">${esc(m.content)}</div>`;
    if(m.role==="typing") return `<div class="msg ai typing"><i></i><i></i><i></i></div>`;
    return `<div class="msg ai fade"><div class="prose" style="font-size:var(--fs-2)">${esc(m.content)}</div>
      ${m.topics&&m.topics.length?`<div class="sources">${m.topics.map(t=>`<span class="chip teal">${esc(t.topic)} ${t.score}%</span>`).join("")}</div>`:""}
      </div>`;
  }).join("");
  c.lastElementChild && c.lastElementChild.scrollIntoView({block:"end"});
}
async function send(text){
  if(!text || !text.trim()) return;
  S.chat.push({role:"user", content:text}); S.chat.push({role:"typing"}); renderChat();
  try{
    const history = S.chat.filter(m=>m.role==="user"||m.role==="assistant").slice(-6)
      .map(m=>({role:m.role, content:m.content}));
    const out = await ai("chat",{ message:text, history: history.slice(0,-1) });
    S.chat.pop(); S.chat.push({role:"assistant", content:out.reply, topics:out.topics});
  }catch(e){
    S.chat.pop(); S.chat.push({role:"assistant", content:"I couldn't reach the AI service. "+e.message});
  }
  renderChat();
}

    {h:"#/learn",t:"Learn",i:"learn",g:"main"},

    + rs.filter(r=>r.g==="quick").map(r=>`<a class="${on(r.h)}" href="${r.h}">${I[r.i]}${r.t}</a>`).join("");

/* ================= router ================= */
function route(){
  const parts = location.hash.replace(/^#\//,"").split("/");
  let view = parts[0] || (S.me.role==="student" ? "home" : "class");
  S.course = null; S.lesson = null;
  if(view==="course" || view==="edit") S.course = parts[1];
  S.gSubject = view==="genome" && parts[1] ? decodeURIComponent(parts[1]) : null;
  S.gTopic   = view==="genome" && parts[2] ? decodeURIComponent(parts[2]) : null;
  if(view==="lesson") S.lesson = parts[1];
  if(!V[view]) view = S.me.role==="student" ? "home" : "class";
  if(S.me.role!=="student" && ["home","learn","genome","examlens","mirage","doctor","portfolio","course","lesson"].includes(view))
    view = "class";
  $("#main").innerHTML = `<div class="fade">${V[view]()}</div>`;
  $("#aside").innerHTML = aside(view);
  buildNav();
  if(view==="counsellor"){
    renderChat();
    const i = $("#ask");
    i && i.addEventListener("keydown", e=>{ if(e.key==="Enter"){ send(i.value); i.value=""; }});
  }
  window.scrollTo(0,0);
}
const rerender = () => route();

/* Re-rendering wipes the form, so read it into the draft first.
   This is what was clearing the lesson pane when the AI ran. */
function captureDraft(){
  if(!$("#lTitle")) return;
  const d = S.cache.draft || {};
  d.title = $("#lTitle").value.trim();
  d.topic = $("#lTopic").value.trim();
  d.duration_min = Number($("#lMin").value) || 20;
  if($("#lBody"))    d.body = $("#lBody").value;
  if($("#lVideo"))   d.video_url = $("#lVideo").value.trim();
  if($("#lTrans"))   d.transcript = $("#lTrans").value;
  if($("#lSummary")) d.summary = $("#lSummary").value;
  if($("#cpQ")){
    const options = $$("[id^=cpO]").map(i=>i.value.trim()).filter(Boolean);
    d.checkpoint = { question:$("#cpQ").value.trim(), options,
      answer: Math.max(0, Math.min(options.length-1, Number($("#cpAns").value)-1)),
      explanation: (d.checkpoint && d.checkpoint.explanation) || "" };
  }
  S.cache.draft = d;
}
async function withBusy(key, fn){
  S.busy[key]=true; rerender();
  try{ await fn(); }catch(e){ toast(e.message||"Something went wrong"); }
  S.busy[key]=false; rerender();
}

      const out = await ai("mirage_mark",{ topic:m.topic,

async function loadStudent(){
  const [{data:courses},{data:enrol},{data:attempts},{data:port}] = await Promise.all([
    sb.from("courses").select("*").eq("published",true).order("created_at",{ascending:false}),
    sb.from("enrollments").select("course_id").eq("student_id",S.me.id),
    sb.from("attempts").select("*").eq("student_id",S.me.id).order("created_at",{ascending:false}).limit(300),
    sb.from("portfolio_items").select("*").eq("student_id",S.me.id).order("created_at",{ascending:false})
  ]);
  S.courses = courses||[]; S.enrolled = (enrol||[]).map(e=>e.course_id);
  S.attempts = attempts||[]; S.portfolio = port||[];
  const ids = S.courses.map(c=>c.id);
  if(ids.length){
    const { data:lessons } = await sb.from("lessons").select("*").in("course_id",ids).eq("published",true);
    S.lessons = lessons||[];
  }
}
async function loadTeacher(){
  const [{data:courses},{data:students}] = await Promise.all([
    sb.from("courses").select("*").eq("teacher_id",S.me.id).order("created_at",{ascending:false}),
    sb.from("profiles").select("id, full_name, grade, created_at").eq("role","student").order("full_name")
  ]);
  S.courses = courses||[]; S.students = students||[];
  const ids = S.courses.map(c=>c.id);
  if(ids.length){
    const [{data:lessons},{data:enrol}] = await Promise.all([
      sb.from("lessons").select("*").in("course_id",ids),
      sb.from("enrollments").select("*").in("course_id",ids)
    ]);
    S.lessons = lessons||[]; S.enrollRows = enrol||[];
  }
  const { data:att } = await sb.from("attempts").select("*").order("created_at",{ascending:false}).limit(1000);
  S.classAttempts = att||[];
}
async function boot(){
  if(!sb){
    $("#gate").innerHTML = `<div style="max-width:380px;text-align:center;padding:20px">
      <b style="color:var(--ink)">Not connected</b>
      <p style="margin-top:8px">${esc(configProblem)}</p></div>`;
    return;
  }
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ location.replace("login.html"); return; }
  const { data:profile, error } = await sb.from("profiles").select("*").eq("id",session.user.id).single();
  if(error || !profile){
    $("#gate").innerHTML = `<div style="text-align:center;padding:20px">Your profile row is missing. Run schema.sql, then sign in again.
      <br><br><button class="btn" onclick="signOut()">Sign out</button></div>`;
    return;
  }
  S.me = profile;

  // Is the v2 schema actually there?
  const probe = await sb.from("courses").select("id").limit(1);
  if(probe.error){
    const missing = /does not exist|schema cache|relation/i.test(probe.error.message);
    $("#gate").innerHTML = `<div style="max-width:460px;padding:24px;text-align:center">
      <b style="color:var(--ink);font-size:16px">${missing?"The database is out of date":"Cannot read the database"}</b>
      <p style="margin-top:10px;line-height:1.6">${missing
        ? "This version needs the newer schema.sql, with the courses, lessons and attempts tables. Open Supabase → SQL Editor, paste the whole of schema.sql, and run it. Then reload this page."
        : esc(probe.error.message)}</p>
      <p style="margin-top:10px;font-size:11px">If you have just run it and still see this, go to Settings → API and click Reload schema cache.</p>
      <button class="btn" style="margin-top:14px" onclick="location.reload()">Reload</button>
      <button class="btn ghost" style="margin-top:8px" onclick="signOut()">Sign out</button></div>`;
    return;
  }

  try{ S.me.role==="student" ? await loadStudent() : await loadTeacher(); }
  catch(e){ toast("Could not load your data: "+e.message); }
  $("#whoami").innerHTML = `${esc(S.me.full_name)}<br><span style="color:var(--teal)">${esc(S.me.role)}</span>`;
  $("#signout").onclick = signOut;
  $("#gate").remove();
  $("#shell").style.visibility = "visible";
  if(!location.hash) location.hash = S.me.role==="student" ? "#/home" : "#/class";
  route();
}
async function signOut(){ await sb.auth.signOut(); location.replace("login.html"); }
boot();
</script>
</body>
</html>
