<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · EduNexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#040a09;--panel:#0a1614;--panel2:#0d1d1a;--line:#153630;--line-soft:#102520;
 --teal:#2fe3c0;--teal-ghost:rgba(47,227,192,.10);--ink:#e6f6f2;--ink-2:#a9c8c1;--mute:#6f918a;
 --warn:#f08a5d;--warn-soft:rgba(240,138,93,.12);--warn-line:rgba(240,138,93,.45);--r:14px;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;
 min-height:100vh;display:grid;place-items:center;padding:24px;line-height:1.5;-webkit-font-smoothing:antialiased;}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
 background:radial-gradient(800px 460px at 20% -10%,rgba(47,227,192,.08),transparent 60%),
 radial-gradient(600px 400px at 100% 100%,rgba(47,227,192,.05),transparent 60%);}
.wrap{position:relative;width:100%;max-width:420px}
.brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:6px}
.brand b{font-size:20px;font-weight:800;letter-spacing:-.02em}
.tagline{text-align:center;color:var(--mute);font-size:12.5px;margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px}
h1{font-size:20px;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--mute);font-size:12.5px;margin-bottom:18px}
.tabs{display:flex;gap:6px;margin-bottom:18px}
.tabs button{flex:1;padding:9px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--ink-2);
 font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--teal);border-color:var(--teal);color:#032019}
label{display:block;font-size:11px;color:var(--mute);margin:12px 0 5px;font-weight:600}
input,select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
 padding:11px 13px;color:var(--ink);font:inherit;font-size:14px}
input:focus,select:focus{outline:2px solid var(--teal);outline-offset:1px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.roles button{padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);
 color:var(--ink-2);font:inherit;font-size:13px;font-weight:600;cursor:pointer;text-align:left}
.roles button.on{border-color:var(--teal);background:var(--teal-ghost);color:var(--teal)}
.roles small{display:block;font-weight:500;font-size:10.5px;color:var(--mute);margin-top:2px}
.btn{width:100%;margin-top:18px;padding:12px;border-radius:10px;border:none;background:var(--teal);
 color:#032019;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.btn[disabled]{opacity:.6;cursor:default}

/* ---- gesture feedback: press + ripple ---- */
.btn,.tabs button,.roles button{position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent;
 transition:transform .16s cubic-bezier(.34,1.56,.64,1),background .15s,border-color .15s,color .15s,filter .15s}
.btn:active,.tabs button:active,.roles button:active{transform:scale(.96)}
.eye{transition:transform .15s cubic-bezier(.34,1.56,.64,1),color .15s}
.eye:active{transform:translateY(-50%) scale(.85)}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);
 transform:scale(0);opacity:.55;pointer-events:none;animation:rippleOut .55s ease-out forwards}
.tabs button .ripple,.roles button .ripple{background:rgba(47,227,192,.35)}
@keyframes rippleOut{to{transform:scale(2.6);opacity:0}}
.msg{margin-top:14px;padding:11px 13px;border-radius:10px;font-size:12.5px;display:none}
.msg.err{display:block;background:var(--warn-soft);border:1px solid var(--warn-line);color:var(--warn)}
.msg.ok{display:block;background:var(--teal-ghost);border:1px solid rgba(47,227,192,.4);color:var(--teal)}
.foot{text-align:center;color:var(--mute);font-size:11px;margin-top:16px;line-height:1.6}
.hide{display:none}
.pwrap{position:relative}
.pwrap input{padding-right:42px}
.eye{position:absolute;right:3px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--mute);
 cursor:pointer;padding:8px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.eye:hover{color:var(--ink)}
.eye:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
.remember{display:flex;align-items:center;gap:9px;margin-top:16px;cursor:pointer;user-select:none}
.remember input{width:16px;height:16px;accent-color:var(--teal);cursor:pointer;margin:0}
.remember span{font-size:12.5px;color:var(--ink-2)}

/* brand mark entrance + idle pulse */
@keyframes brandIn{
  0%{opacity:0;transform:scale(.35) rotate(-18deg)}
  55%{opacity:1;transform:scale(1.12) rotate(4deg)}
  100%{opacity:1;transform:scale(1) rotate(0deg)}
}
@keyframes brandGlow{
  0%,100%{filter:drop-shadow(0 0 0 rgba(47,227,192,0))}
  50%{filter:drop-shadow(0 0 9px rgba(47,227,192,.5))}
}
.brand img{animation:brandIn .7s cubic-bezier(.22,.9,.25,1.3) both,
  brandGlow 3.4s ease-in-out 1s infinite}

/* full-screen sign-in transition */
.signin-fx{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:999}
.signin-fx.show{opacity:1;pointer-events:all}
.signin-fx .ring{position:absolute;width:64px;height:64px;border:1px solid rgba(47,227,192,.4);border-radius:50%;
  opacity:0}
.signin-fx.show .ring{animation:fxRing 1.15s ease-out forwards}
.signin-fx.show .ring.r2{animation-delay:.18s}
.signin-fx.show .ring.r3{animation-delay:.36s}
@keyframes fxRing{
  0%{width:64px;height:64px;opacity:.85}
  100%{width:300px;height:300px;opacity:0}
}
.signin-fx img{width:60px;height:60px;position:relative;z-index:2;opacity:0}
.signin-fx.show img{animation:fxPop .6s cubic-bezier(.22,.9,.25,1.4) forwards}
@keyframes fxPop{
  0%{transform:scale(.3);opacity:0}
  55%{transform:scale(1.18);opacity:1}
  100%{transform:scale(1);opacity:1}
}
.signin-fx .label{position:absolute;bottom:calc(50% - 110px);color:var(--mute);font-size:12.5px;
  letter-spacing:.02em;opacity:0}
.signin-fx.show .label{animation:fxLabel .5s ease .35s forwards}
@keyframes fxLabel{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){
  .brand img{animation:none}
  .signin-fx .ring{animation:none!important;display:none}
  .signin-fx img{animation:none!important;opacity:1}
  .btn,.tabs button,.roles button,.eye{transition:none!important}
  .btn:active,.tabs button:active,.roles button:active{transform:none}
  .eye:active{transform:translateY(-50%)}
  .ripple{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img src="branding/EduNexus-icon-transparent.png" alt="" width="28" style="display:block;height:auto">
    <b>EduNexus</b>
  </div>
  <div class="tagline" id="school">Miracle International School</div>

  <div class="card">
    <div class="tabs">
      <button id="tabIn" class="on">Sign in</button>
      <button id="tabUp">Create account</button>
    </div>

    <h1 id="title">Welcome back</h1>
    <div class="sub" id="sub">Sign in to pick up where your genome left off.</div>

    <div id="upOnly" class="hide">
      <div style="font-size:11px;color:var(--mute);margin:12px 0 5px;font-weight:600">I am a</div>
      <div class="roles">
        <button class="on" data-role="student">Student<small>See my own record</small></button>
        <button data-role="teacher">Teacher<small>See my classes</small></button>
      </div>
      <label for="name">Full name</label>
      <input id="name" autocomplete="name" placeholder="Tharindu Perera">
      <div id="gradeWrap">
        <label for="grade">Class</label>
        <input id="grade" placeholder="Grade 13-C">
      </div>
      <div id="subjectWrap" class="hide">
        <label for="subject">Subject you teach</label>
        <input id="subject" placeholder="Physics">
      </div>
    </div>

    <label for="email">Email address</label>
    <input id="email" type="email" autocomplete="email" placeholder="you@example.com">

    <label for="password">Password</label>
    <div class="pwrap">
      <input id="password" type="password" autocomplete="current-password" placeholder="At least 8 characters">
      <button type="button" class="eye" id="togglePw" aria-label="Show password" aria-pressed="false">
        <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>

    <label class="remember" id="rememberWrap">
      <input type="checkbox" id="remember" checked>
      <span>Keep me signed in on this device</span>
    </label>

    <button class="btn" id="go">Sign in</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="foot">
    Your password is handled by Supabase and never stored by EduNexus.<br>
    CODEFEST 2026 · G027
  </div>
</div>

<div class="signin-fx" id="fx" aria-hidden="true">
  <div class="ring"></div>
  <div class="ring r2"></div>
  <div class="ring r3"></div>
  <img src="branding/EduNexus-icon-transparent.png" alt="">
  <div class="label">Loading your genome…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const $ = s => document.querySelector(s);
let mode = "in", role = "student", db = null, configProblem = null;

/* Tap/click ripple on the sign-in buttons, mirrors app.html. */
document.addEventListener("pointerdown", e=>{
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const el = e.target.closest(".btn,.tabs button,.roles button");
  if(!el || el.disabled) return;
  const r = el.getBoundingClientRect();
  const size = Math.max(r.width, r.height) * 1.15;
  const span = document.createElement("span");
  span.className = "ripple";
  span.style.width = span.style.height = size + "px";
  span.style.left = (e.clientX - r.left - size/2) + "px";
  span.style.top = (e.clientY - r.top - size/2) + "px";
  el.appendChild(span);
  span.addEventListener("animationend", () => span.remove());
});

/* "Keep me signed in" controls WHERE the session token lives: localStorage
   survives closing the browser, sessionStorage clears the moment the tab
   closes (and isn't shared with other tabs). Both login.html and app.html
   read this same flag so the choice made here sticks for the whole session. */
const REMEMBER_KEY = "edunexus_remember";
const rememberOn = () => localStorage.getItem(REMEMBER_KEY) !== "0";
const authStorage = {
  getItem: k => (rememberOn() ? localStorage : sessionStorage).getItem(k),
  setItem: (k,v) => (rememberOn() ? localStorage : sessionStorage).setItem(k,v),
  removeItem: k => (rememberOn() ? localStorage : sessionStorage).removeItem(k),
};
$("#remember").checked = rememberOn();
$("#remember").onchange = () => localStorage.setItem(REMEMBER_KEY, $("#remember").checked ? "1" : "0");

$("#togglePw").onclick = ()=>{
  const showing = $("#password").type === "text";
  $("#password").type = showing ? "password" : "text";
  $("#togglePw").setAttribute("aria-pressed", String(!showing));
  $("#togglePw").setAttribute("aria-label", showing ? "Show password" : "Hide password");
  $("#eyeIcon").innerHTML = showing
    ? '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/>'
    : '<path d="M17.9 17.9A11 11 0 0 1 12 19c-7 0-11-7-11-7a13.2 13.2 0 0 1 3.5-4.3M9.9 5.1A10.9 10.9 0 0 1 12 5c7 0 11 7 11 7a13.2 13.2 0 0 1-2.3 3.1M14.1 14.1a3 3 0 1 1-4.2-4.2"/><path d="M1 1l22 22"/>';
};

/* Build the client defensively: a bad URL or key must not kill the page. */
(function connect(){
  const CFG = window.EDUNEXUS_CONFIG || {};
  const url = (CFG.SUPABASE_URL || "").trim().replace(/\/+$/,"");
  const key = (CFG.SUPABASE_ANON_KEY || "").trim();
  if(!url || url.includes("PASTE_YOUR")){ configProblem = "Add your project URL to config.js."; return; }
  if(!key || key.includes("PASTE_YOUR")){ configProblem = "Add your API key to config.js."; return; }
  if(!/^https:\/\/.+/.test(url)){ configProblem = "The project URL must start with https:// — check config.js."; return; }
  if(url.includes("supabase.com/dashboard")){ configProblem = "That's the dashboard address, not the project URL. Use the one ending in .supabase.co."; return; }
  if(key.length < 20){ configProblem = "That API key looks too short. Copy the whole key."; return; }
  try{ db = supabase.createClient(url, key, { auth: { storage: authStorage, persistSession: true, autoRefreshToken: true } }); }
  catch(err){ configProblem = "Could not connect: " + err.message; }
})();

function say(text, kind){ const m=$("#msg"); m.className = "msg " + kind; m.textContent = text; }

function goApp(){
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    location.replace("app.html"); return;
  }
  $("#fx").classList.add("show");
  setTimeout(()=> location.replace("app.html"), 850);
}

const SCHOOL = (window.EDUNEXUS_CONFIG || {}).SCHOOL_NAME;
if (SCHOOL) $("#school").textContent = SCHOOL;
if (configProblem) say(configProblem, "err");

function setMode(next){
  mode = next;
  $("#tabIn").classList.toggle("on", mode==="in");
  $("#tabUp").classList.toggle("on", mode==="up");
  $("#upOnly").classList.toggle("hide", mode==="in");
  $("#title").textContent = mode==="in" ? "Welcome back" : "Create your account";
  $("#sub").textContent = mode==="in"
    ? "Sign in to pick up where your genome left off."
    : "One account, whether you're learning or teaching.";
  $("#go").textContent = mode==="in" ? "Sign in" : "Create account";
  $("#password").setAttribute("autocomplete", mode==="in" ? "current-password" : "new-password");
  $("#msg").className = "msg";
}
$("#tabIn").onclick = ()=>setMode("in");
$("#tabUp").onclick = ()=>setMode("up");

document.querySelectorAll("[data-role]").forEach(b=>{
  b.onclick = ()=>{
    role = b.dataset.role;
    document.querySelectorAll("[data-role]").forEach(x=>x.classList.toggle("on", x===b));
    $("#gradeWrap").classList.toggle("hide", role!=="student");
    $("#subjectWrap").classList.toggle("hide", role!=="teacher");
  };
});

async function submit(){
  if(!db){ say(configProblem || "Not connected. Check config.js.", "err"); return; }
  const email = $("#email").value.trim(), password = $("#password").value;
  if(!email || !password){ say("Enter your email and password.", "err"); return; }
  localStorage.setItem(REMEMBER_KEY, $("#remember").checked ? "1" : "0");
  $("#go").disabled = true;
  try{
    if(mode==="in"){
      const { error } = await db.auth.signInWithPassword({ email, password });
      if(error) throw error;
      goApp();
    } else {
      const full_name = $("#name").value.trim();
      if(!full_name){ say("Enter your full name.", "err"); $("#go").disabled=false; return; }
      if(password.length < 8){ say("Use at least 8 characters.", "err"); $("#go").disabled=false; return; }
      const { data, error } = await db.auth.signUp({
        email, password,
        options:{ data:{ full_name, role,
          grade: role==="student" ? $("#grade").value.trim() : null,
          subject: role==="teacher" ? $("#subject").value.trim() : null },
          emailRedirectTo: location.origin + "/app.html" }
      });
      if(error) throw error;
      if(data.session) goApp();
      else say("Account created. Check your email to confirm, then sign in.", "ok");
    }
  } catch(err){
    say(err.message || "That didn't work. Try again.", "err");
  } finally {
    $("#go").disabled = false;
  }
}
$("#go").onclick = submit;
document.addEventListener("keydown", e=>{
  if(e.key === "Enter" && !$("#go").disabled && e.target.tagName === "INPUT") submit();
});

/* Already signed in? Go straight through. */
(async ()=>{
  try{ if(db){ const { data } = await db.auth.getSession(); if(data.session) location.replace("app.html"); } }
  catch(err){ say("Could not reach your project: " + err.message, "err"); }
})();
</script>
</body>
</html>
